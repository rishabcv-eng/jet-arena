        for (let x = ox - starCan.width; x < W + starCan.width; x += starCan.width)
          for (let y = oy - starCan.height; y < H + starCan.height; y += starCan.height)
            ctx.drawImage(starCan, x, y);
      }
      ctx.globalAlpha = 1;
    }
    const px = W*0.75 - cam.x*0.05, py = H*0.28;
    const pg = ctx.createRadialGradient(px - 40, py - 40, 10, px, py, 160);
    pg.addColorStop(0, 'rgba(190,170,255,0.38)');
    pg.addColorStop(0.55, 'rgba(120,100,200,0.16)');
    pg.addColorStop(1, 'rgba(90,70,160,0)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, 160, 0, Math.PI*2); ctx.fill();
  } else if (level.bg === 'foundry') {
    for (let i = 0; i < 7; i++) {
      const x = (i*420 - cam.x*0.16) % (W + 420) - 60;
      const pg = ctx.createLinearGradient(x, 0, x + 90, 0);
      pg.addColorStop(0, 'rgba(255,120,50,0.02)');
      pg.addColorStop(0.5, 'rgba(255,140,70,0.09)');
      pg.addColorStop(1, 'rgba(255,120,50,0.02)');
      ctx.fillStyle = pg; ctx.fillRect(x, 0, 90, H);
    }
    // rising embers
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0, n = Q.level >= 2 ? 40 : Q.level === 1 ? 18 : 0; i < n; i++) {
      const ex = (i*167.3 - cam.x*0.25) % (W + 60);
      const ey = H - ((tGlobal*(30 + (i%5)*16) + i*97) % (H + 120));
      const a = 0.25 + 0.35*Math.abs(Math.sin(tGlobal*2 + i));
      ctx.fillStyle = 'rgba(255,' + (140 + (i%4)*22) + ',60,' + a + ')';
      ctx.fillRect((ex + W + 60) % (W + 60) - 30, ey, 2.5, 2.5);
    }
    ctx.globalCompositeOperation = 'source-over';
    const fb = (WORLD.h - cam.y - H/2)*cam.zoom + H/2;      // world floor in screen space
    const glow = ctx.createLinearGradient(0, fb, 0, fb - 320);
    glow.addColorStop(0, 'rgba(255,110,40,0.30)');
    glow.addColorStop(0.5, 'rgba(255,90,30,0.11)');
    glow.addColorStop(1, 'rgba(255,110,40,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, fb - 320, W, 340);
  } else {
    // reactor: pulsing grid + scanning bar
    const pulse = 0.04 + 0.03*Math.sin(tGlobal*2);
    ctx.strokeStyle = 'rgba(157,255,176,' + pulse + ')'; ctx.lineWidth = 1;
    const gs = 60, ox = -cam.x*0.25 % gs, oy = -cam.y*0.25 % gs;
    ctx.beginPath();
    for (let x = ox; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = oy; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    const scanY = (tGlobal*90) % (H + 200) - 100;
    const sg = ctx.createLinearGradient(0, scanY - 60, 0, scanY + 60);
    sg.addColorStop(0, 'rgba(157,255,176,0)');
    sg.addColorStop(0.5, 'rgba(157,255,176,0.07)');
    sg.addColorStop(1, 'rgba(157,255,176,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, scanY - 60, W, 120);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0, n = Q.level >= 2 ? 5 : 0; i < n; i++) {
      const cx2 = W*(0.15 + i*0.18) - cam.x*0.08, cy2 = H*0.5 + Math.sin(tGlobal*0.7 + i)*90;
      const cg = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, 130);
      cg.addColorStop(0, 'rgba(60,255,150,0.05)'); cg.addColorStop(1, 'rgba(60,255,150,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx2, cy2, 130, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---- set dressing --------------------------------------------------------
// Props sit in world space behind the platforms; the foreground layer scrolls
// faster than the camera so the arena feels like it has real depth.
function levelProps() {
  if (Q.level < 1) return;
  const b = level.bg;

  if (b === 'city') {
    for (let i = 0; i < 6; i++) {                      // antenna masts + beacons
      const x = 180 + i*380, base = WORLD.h - 60, h = 150 + (i%3)*90;
      ctx.strokeStyle = 'rgba(150,180,240,0.10)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 14, base - h*0.45); ctx.lineTo(x + 14, base - h*0.45); ctx.stroke();
      const on = Math.sin(tGlobal*2.2 + i) > 0.2;
      ctx.fillStyle = on ? 'rgba(255,90,110,0.85)' : 'rgba(255,90,110,0.2)';
      ctx.beginPath(); ctx.arc(x, base - h - 4, 3.5, 0, Math.PI*2); ctx.fill();
      if (on) light(x, base - h - 4, 46, 'rgba(255,90,110,ALPHA)', 0.22);
    }
  } else if (b === 'foundry') {
    for (let i = 0; i < 5; i++) {                      // pipes with pressure valves
      const x = 120 + i*430, y = 120 + (i%2)*180;
      ctx.fillStyle = 'rgba(90,50,35,0.55)';
      ctx.fillRect(x, y, 260, 22);
      ctx.fillStyle = 'rgba(255,140,60,0.10)';
      ctx.fillRect(x, y, 260, 4);
      ctx.strokeStyle = 'rgba(255,150,70,0.35)'; ctx.lineWidth = 3;
      const a = tGlobal*1.4 + i;
      ctx.save(); ctx.translate(x + 230, y + 11); ctx.rotate(a);
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0);
      ctx.moveTo(0, -11); ctx.lineTo(0, 11); ctx.stroke();
      ctx.restore();
      if (Math.random() < 0.02) parts.push({ x: x + 20, y: y + 22, vx:(Math.random()-0.5)*30,
        vy: 40 + Math.random()*60, life:0.7, color:'rgba(180,180,190,0.35)', size:5, smoke:true });
    }
  } else if (b === 'space') {
    for (let i = 0; i < 7; i++) {                      // slowly tumbling debris
      const x = (i*317 + tGlobal*12) % (WORLD.w + 300) - 150;
      const y = 120 + (i*191) % (WORLD.h - 300);
      ctx.save(); ctx.translate(x, y); ctx.rotate(tGlobal*0.3 + i);
      ctx.fillStyle = 'rgba(120,110,170,0.18)';
      ctx.beginPath();
      ctx.moveTo(-14, -8); ctx.lineTo(10, -13); ctx.lineTo(16, 6); ctx.lineTo(-6, 14);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  } else {
    for (let i = 0; i < 4; i++) {                      // reactor cooling fans
      const x = 240 + i*420, y = 150 + (i%2)*120, r = 40;
      ctx.strokeStyle = 'rgba(157,255,176,0.16)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
      ctx.save(); ctx.translate(x, y); ctx.rotate(tGlobal*3 + i);
      ctx.strokeStyle = 'rgba(157,255,176,0.28)'; ctx.lineWidth = 5;
      for (let k = 0; k < 3; k++) {
        ctx.rotate(Math.PI*2/3);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r - 6, 6); ctx.stroke();
      }
      ctx.restore();
    }
  }
}

// blurred silhouettes drifting in front of the action
function foreground() {
  if (Q.level < 2) return;
  const b = level.bg;
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#04060c';
  const par = 1.45, ox = -(cam.x*par) % 900;
  for (let i = -1; i*900 + ox < W + 900; i++) {
    const x = i*900 + ox;
    if (b === 'city') {
      ctx.fillRect(x, H - 120, 190, 200);
      ctx.fillRect(x + 250, H - 70, 120, 140);
    } else if (b === 'foundry') {
      ctx.fillRect(x, H - 60, W*0.4, 90);
      ctx.beginPath(); ctx.arc(x + 120, H - 60, 60, Math.PI, 0); ctx.fill();
    } else if (b === 'space') {
      ctx.beginPath(); ctx.ellipse(x + 200, H - 40, 260, 70, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillRect(x, 0, 26, H);
      ctx.fillRect(x + 300, 0, 14, H);
    }
  }
  ctx.restore();
}

// lighten (>1) or darken (<1) a #rrggbb colour
function shade(hex, k) {
  if (hex[0] !== '#' || hex.length !== 7) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, Math.round(((n >> 16) & 255) * k)));
  const g = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * k)));
  const b = Math.max(0, Math.min(255, Math.round((n & 255) * k)));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/// ---- the animated fighter -------------------------------------------------
// Two-bone limbs, a jetpack with twin nozzles, a scarf that lags behind your
// momentum, and a distinct silhouette per weapon.
function limb(x1, y1, x2, y2, bend, w, col) {
  const mx = (x1 + x2)/2, my = (y1 + y2)/2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const kx = mx - dy/len * bend, ky = my + dx/len * bend;   // knee / elbow
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(kx, ky, x2, y2); ctx.stroke();
}

function weaponShape(w, kick) {
  ctx.fillStyle = '#dfe9ff';
  if (w === 'rocket') {
    roundRect(11 - kick, -5, 24, 10, 3); ctx.fill();
    ctx.fillStyle = '#ffb347'; ctx.fillRect(31 - kick, -4, 7, 8);
    ctx.fillStyle = '#9fb2d8'; ctx.fillRect(14 - kick, -9, 8, 5);
  } else if (w === 'sniper' || w === 'rail') {
    roundRect(11 - kick, -3, 18, 6, 2); ctx.fill();
    ctx.fillRect(28 - kick, -2, 16, 4);
    ctx.fillStyle = w === 'rail' ? '#a78bfa' : '#9fb2d8';
    ctx.fillRect(16 - kick, -8, 11, 4);                       // scope
  } else if (w === 'shotgun') {
    roundRect(11 - kick, -4, 26, 8, 2); ctx.fill();
    ctx.fillStyle = '#8b6a45'; roundRect(6 - kick, -2, 8, 7, 2); ctx.fill();
  } else if (w === 'minigun') {
    roundRect(9 - kick, -6, 16, 12, 3); ctx.fill();
    ctx.fillStyle = '#9fb2d8';
    for (let i = -1; i <= 1; i++) ctx.fillRect(24 - kick, -1.5 + i*3.5, 18, 2.5);
  } else if (w === 'smg') {
    roundRect(11 - kick, -3.5, 17, 7, 2); ctx.fill();
    ctx.fillStyle = '#9fb2d8'; ctx.fillRect(15 - kick, 3, 5, 8);
  } else {
    roundRect(12 - kick, -3.5, 15, 7, 2); ctx.fill();
  }
}

function drawFighter(pl) {
  const an = pl.anim;
  const blink = pl.guard > 0 && Math.floor(tGlobal*14) % 2 === 0;
  const airborne = !pl.onGround;
  const moving = Math.abs(pl.vx) > 40;
  const flashing = an.flash > 0.5;          // only a hard hit whites you out
  const skin = flashing ? '#ffffff' : pl.color;
  const dark = flashing ? '#dfe9ff' : shade(pl.color, 0.5);

  // --- ground shadow ---
  let floorY = null;
  for (const s of platforms) {
    if (pl.x < s.x - 6 || pl.x > s.x + s.w + 6) continue;
    if (s.y < pl.y + PH/2 - 2) continue;
    if (floorY === null || s.y < floorY) floorY = s.y;
  }
  if (floorY !== null) {
    const drop = floorY - (pl.y + PH/2);
    if (drop < 420) {
      const k = 1 - drop/420;
      ctx.globalAlpha = 0.34*k; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(pl.x, floorY + 2, 15*k + 5, 4.5*k + 1.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // --- speed ghost ---
  const spd = Math.hypot(pl.vx, pl.vy);
  if (spd > 620) {
    ctx.globalAlpha = Math.min(0.30, (spd - 620)/1600);
    ctx.fillStyle = pl.color;
    roundRect(pl.x - PW/2 - pl.vx*0.018, pl.y - PH/2 - pl.vy*0.018, PW, PH, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // --- emitted light ---
  if (pl.jetting && pl.fuel > 0) light(pl.x, pl.y + 22, 140, 'rgba(255,150,60,ALPHA)', 0.34);
  if (an.recoil > 0.5) light(pl.x + Math.cos(pl.aim)*30, pl.y + Math.sin(pl.aim)*30, 150, 'rgba(255,240,180,ALPHA)', 0.45);
  if (pl.shield > 0) light(pl.x, pl.y, 64, 'rgba(110,231,255,ALPHA)', 0.18);
  if (pl.buffs.damage > 0) light(pl.x, pl.y, 64, 'rgba(255,107,129,ALPHA)', 0.18);

  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.globalAlpha = blink ? 0.4 : 1;
  const stretch = airborne ? Math.max(-0.12, Math.min(0.18, pl.vy/2600)) : 0;
  ctx.scale(1 + an.squash*0.28 - stretch, 1 - an.squash*0.3 + stretch);
  ctx.rotate(an.lean*0.5);

  // --- scarf: lags behind momentum ---
  if (Q.level >= 1) {
    const tail = -Math.max(-1, Math.min(1, pl.vx/480));
    ctx.strokeStyle = shade(pl.color, 0.9); ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -PH/2 + 8);
    ctx.quadraticCurveTo(tail*12, -PH/2 + 14 + Math.sin(tGlobal*9)*2, tail*24, -PH/2 + 10 + Math.sin(tGlobal*7)*4);
    ctx.stroke();
  }

  // --- jetpack unit + twin flames ---
  ctx.fillStyle = 'rgba(12,18,34,0.95)';
  roundRect(-pl.face*6 - 7, -10, 13, 20, 4); ctx.fill();
  ctx.fillStyle = dark;
  roundRect(-pl.face*6 - 5, -8, 4, 16, 2); ctx.fill();
  if (pl.jetting && pl.fuel > 0) {
    const big = pl.buffs && pl.buffs.fuel > 0;
    for (const nx of [-5, 3]) {
      const len = 18 + Math.random()*16 + (big ? 12 : 0);
      const g = ctx.createLinearGradient(0, 10, 0, 10 + len);
      g.addColorStop(0, 'rgba(255,240,190,0.8)');
      g.addColorStop(0.45, 'rgba(255,150,60,0.75)');
      g.addColorStop(1, 'rgba(255,90,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(nx - pl.face*3 - 3, 10); ctx.lineTo(nx - pl.face*3 + 3, 10);
      ctx.lineTo(nx - pl.face*3 + 1, 10 + len); ctx.lineTo(nx - pl.face*3 - 1, 10 + len);
      ctx.closePath(); ctx.fill();
    }
  }

  // --- legs: two-bone with knee bend ---
  const hipY = 7;
  if (airborne) {
    const tuck = pl.vy < 0 ? 8 : 4;
    limb(-3, hipY, -7, hipY + 13 - tuck*0.4, 4, 5.5, dark);
    limb(3, hipY, 8, hipY + 11 - tuck*0.3, -4, 5.5, dark);
  } else if (moving) {
    const ph = an.walk*6, s1 = Math.sin(ph), s2 = Math.sin(ph + Math.PI);
    limb(-2, hipY, -2 + s1*10, hipY + 15 - Math.abs(s1)*3, 5, 5.5, dark);
    limb(2, hipY, 2 + s2*10, hipY + 15 - Math.abs(s2)*3, 5, 5.5, dark);
  } else {
    limb(-4, hipY, -5, hipY + 15, 2, 5.5, dark);
    limb(4, hipY, 5, hipY + 15, -2, 5.5, dark);
  }

  // --- torso ---
  const tg = ctx.createLinearGradient(-PW/2, -PH/2 + 6, PW/2, PH/2 - 10);
  tg.addColorStop(0, flashing ? '#fff' : shade(pl.color, 1.12));
  tg.addColorStop(0.55, skin);
  tg.addColorStop(1, dark);
  ctx.fillStyle = tg;
  roundRect(-PW/2 + 3, -PH/2 + 6, PW - 6, PH - 16, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(5,8,16,0.75)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  roundRect(-PW/2 + 5, -PH/2 + 8, 4, PH - 22, 2); ctx.fill();
  // rim light picked up from the arena accent colour
  ctx.strokeStyle = level.pal.edge; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(PW/2 - 3, -PH/2 + 10); ctx.lineTo(PW/2 - 3, PH/2 - 12); ctx.stroke();

  // --- helmet ---
  const headTilt = Math.max(-0.5, Math.min(0.5, Math.sin(pl.aim)*0.5));
  ctx.save();
  ctx.translate(0, -PH/2 + 1);
  ctx.rotate(headTilt*pl.face*0.4);
  const hg = ctx.createRadialGradient(-3, -3, 1, 0, 0, 9);
  hg.addColorStop(0, flashing ? '#fff' : shade(pl.color, 1.15));
  hg.addColorStop(1, dark);
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(5,8,16,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  const vg = ctx.createLinearGradient(-5, -3, 5, 3);
  vg.addColorStop(0, 'rgba(7,11,20,0.95)');
  vg.addColorStop(1, 'rgba(140,235,255,0.65)');
  ctx.fillStyle = vg;
  roundRect(pl.face*1 - 5, -3.5, 9.5, 6.5, 2.5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;   // visor glint
  ctx.beginPath(); ctx.arc(-2, -4, 5, Math.PI*1.05, Math.PI*1.45); ctx.stroke();
  ctx.restore();
  ctx.restore();

  // --- gun arm, aimed in world space ---
  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.globalAlpha = blink ? 0.4 : 1;
  ctx.rotate(pl.aim);
  const kick = an.recoil*7;
  limb(-8, 4, 12 - kick, 0, 5, 4.5, dark);        // support arm
  limb(-2, -3, 14 - kick, 0, -4, 5, skin);        // firing arm
  weaponShape(pl.weapon, kick);
  ctx.fillStyle = skin;                            // hand on the grip
  ctx.beginPath(); ctx.arc(13 - kick, 0, 3.4, 0, Math.PI*2); ctx.fill();

  if (an.melee > 0) {
    const sw = (1 - an.melee)*2.2 - 1.1;
    ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(0.9, an.melee) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 40, sw - 0.5, sw + 0.5); ctx.stroke();
    ctx.strokeStyle = 'rgba(110,231,255,' + Math.min(0.5, an.melee*0.6) + ')'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(0, 0, 40, sw - 0.35, sw + 0.35); ctx.stroke();
  }
  if (an.recoil > 0.55) {
    const fq = (an.recoil - 0.55)/0.45, r = 7 + fq*8;
    ctx.fillStyle = 'rgba(255,225,150,' + (0.30 + fq*0.45) + ')';
    ctx.beginPath();
    ctx.moveTo(30 - kick, 0);
    ctx.lineTo(30 - kick + r, -r*0.5);
    ctx.lineTo(30 - kick + r*1.1, 0);
    ctx.lineTo(30 - kick + r, r*0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5*fq) + ')';
    ctx.beginPath(); ctx.arc(30 - kick, 0, 2.5 + fq*3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // --- shield / buff rings ---
  if (pl.shield > 0) {
    ctx.strokeStyle = 'rgba(110,231,255,' + (0.35 + 0.3*Math.sin(tGlobal*7)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, 26, 0, Math.PI*2); ctx.stroke();
  }
  if (pl.buffs.damage > 0) {
    ctx.strokeStyle = 'rgba(255,107,129,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, 22 + Math.sin(tGlobal*9)*2, 0, Math.PI*2); ctx.stroke();
  }

  // --- name + health ---
  const bw = 34;
  ctx.fillStyle = 'rgba(7,11,20,0.7)'; ctx.fillRect(pl.x - bw/2, pl.y - PH/2 - 16, bw, 5);
  ctx.fillStyle = pl.hp > 50 ? '#9dffb0' : pl.hp > 25 ? '#ffd166' : '#ff6b81';
  ctx.fillRect(pl.x - bw/2, pl.y - PH/2 - 16, bw*Math.max(0, pl.hp)/pl.hpMax, 5);
  if (pl.shield > 0) {
    ctx.fillStyle = '#6ee7ff';
    ctx.fillRect(pl.x - bw/2, pl.y - PH/2 - 20, bw*pl.shield/POWERS.shield.amount, 3);
  }
  if (pl.isBot || pl.isRemote) {
    ctx.fillStyle = 'rgba(234,246,255,0.5)'; ctx.font = '500 10px ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.fillText(pl.name, pl.x, pl.y - PH/2 - 24);
  }
}

// ---- atmosphere ----------------------------------------------------------
const ATMO = {
  city:    { ray: '170,205,255', grade: 'rgba(70,120,210,0.14)', mote: 'rgba(200,220,255,A)', drift: [10, 0],   add: false },
  foundry: { ray: '255,150,70',  grade: 'rgba(255,120,40,0.16)', mote: 'rgba(200,190,185,A)', drift: [4, 18],   add: false },
  space:   { ray: '180,150,255', grade: 'rgba(140,95,255,0.13)', mote: 'rgba(230,225,255,A)', drift: [3, -2],   add: true  },
  reactor: { ray: '120,255,170', grade: 'rgba(60,255,150,0.10)', mote: 'rgba(120,255,170,A)', drift: [2, -14],  add: true  }
};

// slanted shafts of light falling from above, swaying slowly (screen space)
function godRays() {
  if (Q.level < 1) return;
  const a = ATMO[level.bg]; if (!a) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const n = Q.level >= 2 ? 4 : 2;
  for (let i = 0; i < n; i++) {
    const sway = Math.sin(tGlobal*0.25 + i*1.7)*40;
    const x = ((i + 0.5) / n) * W * 1.1 - cam.x*0.06 % W + sway;
    const topW = 60 + (i % 2)*50, botW = topW*3.2, lean = W*0.18;
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    const strength = 0.055 + 0.025*Math.sin(tGlobal*0.6 + i*2.3);
    gr.addColorStop(0, 'rgba(' + a.ray + ',' + strength + ')');
    gr.addColorStop(0.7, 'rgba(' + a.ray + ',' + strength*0.25 + ')');
    gr.addColorStop(1, 'rgba(' + a.ray + ',0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(x - topW/2, 0); ctx.lineTo(x + topW/2, 0);
    ctx.lineTo(x + lean + botW/2, H); ctx.lineTo(x + lean - botW/2, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// air particles in world space; positions are a pure function of time, so
// there is no state to update or sync
let motes = [], motesFor = -1;
function airMotes() {
  if (Q.level < 1) return;
  const a = ATMO[level.bg]; if (!a) return;
  if (motesFor !== levelIndex) {
    const R = rng(4242 + levelIndex*97);
    motes = [];
    for (let i = 0; i < 150; i++) {
      motes.push({ x: R()*WORLD.w, y: R()*WORLD.h, s: 0.8 + R()*1.8, sp: 0.5 + R(),
                   ph: R()*6.28, al: 0.15 + R()*0.35 });
    }
    motesFor = levelIndex;
  }
  const vx0 = cam.x - 40, vx1 = cam.x + W/cam.zoom + 40, vy0 = cam.y - 40, vy1 = cam.y + H/cam.zoom + 40;
  if (a.add) ctx.globalCompositeOperation = 'lighter';
  const n = Q.level >= 2 ? motes.length : motes.length >> 1;
  for (let i = 0; i < n; i++) {
    const m = motes[i];
    let x = (m.x + tGlobal*a.drift[0]*m.sp + Math.sin(tGlobal*0.7 + m.ph)*12) % WORLD.w;
    let y = (m.y + tGlobal*a.drift[1]*m.sp + Math.cos(tGlobal*0.5 + m.ph)*8) % WORLD.h;
    if (x < 0) x += WORLD.w; if (y < 0) y += WORLD.h;
    if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
    const tw = 0.6 + 0.4*Math.sin(tGlobal*2 + m.ph);
    ctx.fillStyle = a.mote.replace('A', (m.al*tw).toFixed(3));
    ctx.fillRect(x, y, m.s, m.s);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// a gentle per-arena colour grade over the finished world
function colorGrade() {
  if (Q.level < 2) return;
  const a = ATMO[level.bg]; if (!a) return;
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = a.grade;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ---- platform materials ----------------------------------------------------
// Every slab is painted once into its own offscreen canvas (bevel, material,
// rivets, struts, shadow) and then blitted with a single drawImage per frame.
// Detail is seeded per platform, so it never shimmers between redraws.
function rng(seed) {
  let s = (seed >>> 0) || 1;
  return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
}
function rrOn(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w/2, h/2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

const SKIN_PAD = 22;                 // room under the slab for struts + shadow
function platSkin(s, key, seed) {
  if (s._skin && s._skinKey === key) return s._skin;
  const w = Math.max(2, Math.round(s.w)), h = Math.max(2, Math.round(s.h));
  const big = w > 1000 || h > 200;   // ground slabs, outer walls, ceiling
  const k = Math.min(2, dpr);        // render at screen density so zoom stays crisp
  const c = offscreen(w*k, (h + SKIN_PAD)*k), g = c.getContext('2d');
  g.scale(k, k);
  const R = rng(seed);
  const pal = level.pal, bgk = level.bg;

  // underside: soft contact shadow and support struts on floating slabs
  if (!big) {
    const sg = g.createLinearGradient(0, h, 0, h + 16);
    sg.addColorStop(0, 'rgba(0,0,0,0.38)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg; g.fillRect(6, h, w - 12, 16);
    g.fillStyle = 'rgba(4,6,12,0.75)';
    for (let x = 34; x < w - 24; x += 150) {
      g.fillRect(x, h - 1, 5, SKIN_PAD - 5);
      g.fillRect(x - 5, h + SKIN_PAD - 7, 15, 3);
    }
  }

  // body: lit from above, falling off into shadow
  const body = g.createLinearGradient(0, 0, 0, h);
  body.addColorStop(0, shade(pal.plat, 1.45));
  body.addColorStop(0.22, pal.plat);
  body.addColorStop(1, shade(pal.plat, 0.42));
  g.fillStyle = body;
  rrOn(g, 0, 0, w, h, big ? 0 : Math.min(5, h/3)); g.fill();
  g.save(); rrOn(g, 0, 0, w, h, big ? 0 : Math.min(5, h/3)); g.clip();

  // ---- material ----
  if (bgk === 'city') {
    for (let x = 48; x < w - 8; x += 52) {          // plate seams
      g.fillStyle = 'rgba(0,0,0,0.38)'; g.fillRect(x, 5, 2, h);
      g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(x + 2, 5, 1, h);
    }
    for (let x = 10; x < w - 6; x += 26) {          // rivets
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.arc(x + 0.6, 8.6, 1.8, 0, Math.PI*2); g.fill();
      g.fillStyle = 'rgba(190,210,255,0.28)'; g.beginPath(); g.arc(x, 8, 1.5, 0, Math.PI*2); g.fill();
    }
    if (!big && h >= 22) {                           // hazard-striped end caps
      for (const ex of [0, w - 14]) {
        g.save(); g.beginPath(); g.rect(ex, 4, 14, h - 6); g.clip();
        g.fillStyle = 'rgba(20,20,20,0.9)'; g.fillRect(ex, 4, 14, h);
        g.fillStyle = 'rgba(255,200,60,0.75)';
        for (let d = -h; d < 30; d += 10) {
          g.beginPath(); g.moveTo(ex + d, 4); g.lineTo(ex + d + 5, 4);
          g.lineTo(ex + d + 5 + h, h + 4); g.lineTo(ex + d + h, h + 4); g.closePath(); g.fill();
        }
        g.restore();
      }
    }
  } else if (bgk === 'foundry') {
    const n = Math.min(500, (w*h) * 0.006);         // rust speckle
    for (let i = 0; i < n; i++) {
      const x = R()*w, y = 4 + R()*(h - 4), r = 0.6 + R()*1.8;
      g.fillStyle = R() < 0.5 ? 'rgba(150,70,30,0.35)' : 'rgba(0,0,0,0.28)';
      g.fillRect(x, y, r, r);
    }
    for (let x = 12; x < w - 6; x += 30) {           // rivets
      g.fillStyle = 'rgba(255,170,110,0.22)'; g.beginPath(); g.arc(x, 8, 1.5, 0, Math.PI*2); g.fill();
    }
    const heat = g.createLinearGradient(0, h - 6, 0, h);   // glowing heat seam
    heat.addColorStop(0, 'rgba(255,110,30,0)'); heat.addColorStop(1, 'rgba(255,140,50,0.75)');
    g.fillStyle = heat; g.fillRect(0, h - 6, w, 6);
  } else if (bgk === 'space') {
    g.fillStyle = 'rgba(255,255,255,0.05)';          // hull panel breaks
    for (let x = 60; x < w - 10; x += 64) g.fillRect(x, 5, 1, h - 7);
    const my = Math.max(8, h*0.62);                   // running-light strip
    g.fillStyle = 'rgba(12,10,30,0.7)'; g.fillRect(6, my - 2, w - 12, 4);
    for (let x = 12; x < w - 10; x += 18) {
      g.fillStyle = (x/18|0) % 3 === 0 ? 'rgba(110,231,255,0.95)' : 'rgba(167,139,250,0.75)';
      g.fillRect(x, my - 1, 4, 2);
    }
  } else {
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1;   // diagonal grating
    g.beginPath();
    for (let d = -h; d < w; d += 7) { g.moveTo(d, 5); g.lineTo(d + h, h + 5); }
    g.stroke();
    g.fillStyle = 'rgba(120,255,170,0.85)';           // emissive strip under the lip
    g.fillRect(0, 4, w, 1.5);
    if (!big) {
      g.fillStyle = 'rgba(157,255,176,0.55)';         // chevrons on the ends
      for (const ex of [6, w - 16]) {
        g.beginPath(); g.moveTo(ex, 8); g.lineTo(ex + 5, 8 + (h - 12)/2);
        g.lineTo(ex, h - 4); g.lineTo(ex + 4, h - 4); g.lineTo(ex + 9, 8 + (h - 12)/2);
        g.lineTo(ex + 4, 8); g.closePath(); g.fill();
      }
    }
  }
  g.restore();

  // bevel: bright lip, fine highlight, dark groove, dark underside
  g.fillStyle = pal.edge; g.fillRect(0, 0, w, 3);
  g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(0, 0, w, 1);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 3, w, 1);
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, h - 2, w, 2);

  s._skin = c; s._skinKey = key;
  return c;
}

function draw() {
  background();
  godRays();

  ctx.save();
  const sx = shake ? (Math.random()-0.5)*shake : 0;
  const sy = shake ? (Math.random()-0.5)*shake : 0;
  ctx.translate(W/2, H/2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-W/2, -H/2);
  ctx.translate(-cam.x + sx, -cam.y + sy);

  levelProps();

  // platforms: shaded body, lit top edge, panel lines, dark underside
  const viewL = cam.x - 80, viewR = cam.x + W/cam.zoom + 80;
  const dk = '|' + Math.min(2, dpr);
  level.plats.forEach((s, i) => {
    if (s.x + s.w < viewL || s.x > viewR) return;           // cull offscreen slabs
    const sk = platSkin(s, level.name + i + dk, i*7919 + 104729*levelIndex + 17);
    ctx.drawImage(sk, s.x, s.y, s.w, s.h + SKIN_PAD);
  });

  // scorch marks
  for (const dc of decals) {
    ctx.globalAlpha = dc.life * 0.45;
    ctx.fillStyle = '#05070c';
    ctx.beginPath(); ctx.ellipse(dc.x, dc.y, dc.r, dc.r*0.42, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // movers get a marker so you can read them
  level.movers.forEach((m, i) => {
    ctx.drawImage(platSkin(m, level.name + 'm' + i + dk, 900 + i*31), m.x, m.y, m.w, m.h + SKIN_PAD);
    // a moving platform announces itself: cyan lip + scrolling tread lights
    ctx.fillStyle = 'rgba(110,231,255,0.8)'; ctx.fillRect(m.x, m.y, m.w, 2);
    const run = (tGlobal*40) % 18;
    ctx.fillStyle = 'rgba(110,231,255,0.55)';
    for (let x = 6 + run; x < m.w - 8; x += 18) ctx.fillRect(m.x + x, m.y + m.h - 4, 7, 2);
    light(m.x + m.w/2, m.y + m.h, 70, 'rgba(110,231,255,ALPHA)', 0.12);
  });
  // lava
  for (const lv of level.lava) {
    const g = ctx.createLinearGradient(0, lv.y - 6, 0, lv.y + lv.h);
    g.addColorStop(0, '#ffd166'); g.addColorStop(0.35, '#ff7a2f'); g.addColorStop(1, '#8c1d05');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(lv.x, lv.y + 6);
    for (let x = 0; x <= lv.w; x += 16) {
      ctx.lineTo(lv.x + x, lv.y + 4 + Math.sin(tGlobal*3 + x*0.05)*4);
    }
    ctx.lineTo(lv.x + lv.w, lv.y + lv.h); ctx.lineTo(lv.x, lv.y + lv.h);
    ctx.closePath(); ctx.fill();
    for (let x = lv.x + 40; x < lv.x + lv.w; x += 90) light(x, lv.y, 150, 'rgba(255,120,40,ALPHA)', 0.22);
  }
  // portals
  for (const pt of level.portals) {
    const pulse = 0.5 + 0.5*Math.sin(tGlobal*4);
    ctx.fillStyle = 'rgba(167,139,250,' + (0.18 + pulse*0.22) + ')';
    roundRect(pt.x, pt.y, pt.w, pt.h, 10); ctx.fill();
    ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const yy = pt.y + ((tGlobal*60 + i*40) % pt.h);
      ctx.fillStyle = 'rgba(234,246,255,0.5)';
      ctx.fillRect(pt.x + 6, yy, pt.w - 12, 2);
    }
    light(pt.x + pt.w/2, pt.y + pt.h/2, 120, 'rgba(167,139,250,ALPHA)', 0.25 + pulse*0.15);
  }

  // pickups
  for (const pk of pickups) {
    if (!pk.ready) {
      // taken: leave a ghost of the spot with a countdown, so players can
      // learn the timings and be there when it comes back
      if (pk.temp || (pk.kind === 'med' && pk.respawn > 4)) continue;
      const col = pk.kind === 'gun' ? (pk.tier === 3 ? '#ffd166' : '#6ee7ff')
                : pk.kind === 'med' ? '#9dffb0' : POWERS[pk.power].color;
      ctx.globalAlpha = 0.35;
      ctx.setLineDash([4, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      roundRect(pk.x - 15, pk.y - 11, 30, 22, 5); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = col; ctx.font = '700 10px ui-monospace, monospace'; ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(pk.respawn) + 's', pk.x, pk.y + 4);
      ctx.globalAlpha = 1;
      continue;
    }
    const bob = Math.sin(pk.t*3)*5;
    if (pk.kind === 'gun') {
      const power = pk.tier === 3;
      const col = power ? '#ffd166' : '#6ee7ff';
      if (power) {
        light(pk.x, pk.y, 90, 'rgba(255,209,102,ALPHA)', 0.30 + 0.12*Math.sin(pk.t*4));
        ctx.strokeStyle = 'rgba(255,209,102,' + (0.25 + 0.2*Math.sin(pk.t*4)) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pk.x, pk.y + bob, 26, 0, Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle = power ? 'rgba(255,209,102,0.2)' : 'rgba(110,231,255,0.15)';
      ctx.strokeStyle = col; ctx.lineWidth = power ? 2.5 : 2;
      roundRect(pk.x - 19, pk.y - 12 + bob, 38, 24, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col; ctx.font = '700 8px ui-monospace, monospace'; ctx.textAlign = 'center';
      ctx.fillText(WEAPONS[pk.gun].name.slice(0, 5), pk.x, pk.y + 2 + bob);
    } else if (pk.kind === 'med') {
      ctx.fillStyle = 'rgba(157,255,176,0.15)'; ctx.strokeStyle = '#9dffb0'; ctx.lineWidth = 2;
      roundRect(pk.x - 14, pk.y - 12 + bob, 28, 24, 5); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#9dffb0'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pk.x - 6, pk.y + bob); ctx.lineTo(pk.x + 6, pk.y + bob);
      ctx.moveTo(pk.x, pk.y - 6 + bob); ctx.lineTo(pk.x, pk.y + 6 + bob); ctx.stroke();
    } else {
      const P = POWERS[pk.power];
      ctx.save();
      ctx.translate(pk.x, pk.y + bob); ctx.rotate(Math.sin(pk.t*2)*0.3);
      ctx.fillStyle = P.color + '33'; ctx.strokeStyle = P.color; ctx.lineWidth = 2;
      roundRect(-13, -13, 26, 26, 6); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = P.color; ctx.font = '600 8px ui-monospace, monospace'; ctx.textAlign = 'center';
      ctx.fillText(P.name.slice(0, 5), pk.x, pk.y + 26 + bob);
    }
  }

  // airdrops
  for (const d of drops) {
    ctx.strokeStyle = 'rgba(255,209,102,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(d.x, d.y - 30); ctx.lineTo(d.x - 14, d.y - 8);
    ctx.moveTo(d.x, d.y - 30); ctx.lineTo(d.x + 14, d.y - 8); ctx.stroke();
    ctx.fillStyle = '#ffd166'; roundRect(d.x - 14, d.y - 12, 28, 24, 4); ctx.fill();
  }

  // grenades
  for (const g of grenades) {
    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
    ctx.fillStyle = g.t < 0.6 && Math.floor(tGlobal*12) % 2 ? '#ff6b81' : '#cfe3ff';
    roundRect(-5, -7, 10, 14, 4); ctx.fill();
    ctx.restore();
  }

  // casings
  for (const c of casings) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, c.life);
    ctx.fillStyle = '#c9a14a'; ctx.fillRect(-3, -1.5, 6, 3);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // bullets with glow
  for (const b of bullets) {
    ctx.strokeStyle = b.rocket ? '#ffb347' : b.color;
    ctx.lineWidth = b.rocket ? 6 : 3; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*0.02, b.y - b.vy*0.02); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = b.rocket ? 4 : 1.8;
    ctx.strokeStyle = '#fff6d8';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*0.008, b.y - b.vy*0.008); ctx.stroke();
  }

  // corpses
  for (const c of corpses) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, c.life/1.2);
    ctx.fillStyle = c.color;
    roundRect(-PW/2 + 3, -PH/2 + 6, PW - 6, PH - 16, 6); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  for (const pl of players) if (!pl.dead) drawFighter(pl);

  // railgun beams
  for (const bm of beams) {
    ctx.globalAlpha = Math.max(0, bm.life);
    ctx.strokeStyle = bm.color; ctx.lineWidth = 3 + bm.life*9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1 + bm.life*3;
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // shockwaves
  for (const w of waves) {
    ctx.strokeStyle = 'rgba(255,200,120,' + Math.max(0, w.life*0.55) + ')';
    ctx.lineWidth = 3 + w.life*5;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI*2); ctx.stroke();
    light(w.x, w.y, w.max*1.6, 'rgba(255,170,80,ALPHA)', w.life*0.75);
  }
  for (const bm of beams) light((bm.x1+bm.x2)/2, (bm.y1+bm.y2)/2, 220, 'rgba(167,139,250,ALPHA)', bm.life*0.4);

  // fireballs: a white-hot core that swells into orange and burns out,
  // drawn additively so bloom picks it up
  if (fireballs.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const f of fireballs) {
      const p = f.t / f.life, fade = 1 - p;
      const R = f.r * (0.35 + p*0.75);
      light(f.x, f.y, f.r*2.4, 'rgba(255,160,70,ALPHA)', fade*0.8);
      const g = ctx.createRadialGradient(f.x, f.y - p*18, 0, f.x, f.y - p*18, R);
      g.addColorStop(0, 'rgba(255,250,225,' + (fade*fade) + ')');
      g.addColorStop(0.3, 'rgba(255,200,90,' + fade*0.9 + ')');
      g.addColorStop(0.65, 'rgba(255,110,40,' + fade*0.6 + ')');
      g.addColorStop(1, 'rgba(180,40,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y - p*18, R, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // particles — smoke and debris normally, sparks additively so they read as hot
  for (const q of parts) {
    if (!q.smoke && !q.chunk) continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life*2));
    ctx.fillStyle = q.color;
    const s = q.size || 3;
    if (q.chunk) {
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot || 0);
      ctx.fillRect(-s/2, -s*0.35, s, s*0.7);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(q.x, q.y, s, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) {
    if (q.smoke || q.chunk) continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life*2));
    ctx.fillStyle = q.color;
    const s = q.size || 3;
    ctx.fillRect(q.x - s/2, q.y - s/2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  airMotes();
  lightPass();

  // damage numbers
  ctx.textAlign = 'center';
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life*1.6));
    ctx.fillStyle = f.color;
    ctx.font = '700 ' + (f.big ? 20 : 14) + 'px ui-monospace, monospace';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  bloomPass();
  colorGrade();
  foreground();
  postFX();
  screenEffects();
  hud();
  if (state === 'play' && !paused) crosshair();
  if (state === 'menu') menuScreen();
  if (state === 'over') overScreen();
  if (state === 'play' && paused) pauseScreen();
}

function screenEffects() {
  if (flashWhite > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.5, flashWhite*0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  const pl = me();
  const crit = pl && !pl.dead && pl.hp < 35 ? (1 - pl.hp/35)*(0.5 + 0.5*Math.sin(tGlobal*6)) : 0;
  const amt = Math.max(hurtFlash*0.75, crit*0.55);
  if (amt <= 0.01) return;
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.32, W/2, H/2, Math.max(W,H)*0.72);
  g.addColorStop(0, 'rgba(255,60,90,0)');
  g.addColorStop(1, 'rgba(255,40,70,' + Math.min(0.72, amt) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function crosshair() {
  if (!ui.mouseAim || me().dead) return;
  const x = ui.mouseX, y = ui.mouseY, r = 11;
  ctx.strokeStyle = hitMark > 0 ? '#ff6b81' : 'rgba(234,246,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x - 4, y);
  ctx.moveTo(x + 4, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y - 4);
  ctx.moveTo(x, y + 4); ctx.lineTo(x, y + r);
  ctx.stroke();
  if (hitMark > 0) {
    const s = 7 + (1 - hitMark/0.16)*4;
    ctx.strokeStyle = '#ff6b81'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
    ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
    ctx.stroke();
  }
}

// ------------------------------- HUD -------------------------------
function bar(x, y, w, h, frac, color, bg) {
  ctx.fillStyle = bg || 'rgba(7,11,20,0.7)';
  roundRect(x, y, w, h, h/2); ctx.fill();
  ctx.fillStyle = color;
  roundRect(x, y, Math.max(0, w*frac), h, h/2); ctx.fill();
}

function hud() {
  const pl = me();
  if (!pl) return;

  // ---- vitals panel (top-left) ----
  const glass = (x, y, w, h, tint) => {
    ctx.fillStyle = 'rgba(8,13,28,0.62)';
    roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = tint || 'rgba(110,231,255,0.18)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.04)';             // glass sheen on the top half
    roundRect(x + 1, y + 1, w - 2, h/2 - 1, 9); ctx.fill();
  };
  // the red "damage trail" drains down to your real HP a moment after a hit
  const hdt = Math.min(0.1, Math.max(0, tGlobal - (hud._t || tGlobal))); hud._t = tGlobal;
  if (hud._hp === undefined || pl.hp > hud._hp || pl.dead) hud._hp = Math.max(0, pl.hp);
  else hud._hp += (pl.hp - hud._hp) * Math.min(1, hdt*2.5);

  const px0 = L.pad - 8, pw = L.barW + 66, crit = pl.hp < 30 && !pl.dead;
  glass(px0, 10, pw, 62, crit ? 'rgba(255,107,129,' + (0.35 + 0.3*Math.sin(tGlobal*8)) + ')' : null);
  const bx = L.pad + 26, bw0 = L.barW;
  // health
  ctx.fillStyle = '#ff6b81';                                 // plus-shaped HP glyph
  ctx.fillRect(L.pad + 3, 22, 12, 4); ctx.fillRect(L.pad + 7, 18, 4, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(bx, 18, bw0, 12, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,110,0.55)';
  roundRect(bx, 18, Math.max(0, bw0*hud._hp/pl.hpMax), 12, 6); ctx.fill();
  const hpc = pl.hp > 50 ? ['#b8ffc8', '#4fd98a'] : pl.hp > 25 ? ['#ffe29a', '#e0a93a'] : ['#ff9aa9', '#e0445e'];
  const hg2 = ctx.createLinearGradient(0, 18, 0, 30);
  hg2.addColorStop(0, hpc[0]); hg2.addColorStop(1, hpc[1]);
  ctx.fillStyle = hg2;
  roundRect(bx, 18, Math.max(0, bw0*Math.max(0, pl.hp)/pl.hpMax), 12, 6); ctx.fill();
  if (pl.shield > 0) {
    ctx.fillStyle = 'rgba(110,231,255,0.75)';
    roundRect(bx, 18, bw0*pl.shield/POWERS.shield.amount, 4, 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(234,246,255,0.85)'; ctx.font = '700 9px ui-monospace, monospace';
  ctx.textAlign = 'right'; ctx.fillText(String(Math.max(0, Math.ceil(pl.hp))), bx + bw0 - 5, 27);
  // jet fuel: segmented gauge
  ctx.fillStyle = '#ffb347';                                 // flame glyph
  ctx.beginPath(); ctx.moveTo(L.pad + 9, 38); ctx.quadraticCurveTo(L.pad + 16, 46, L.pad + 9, 52);
  ctx.quadraticCurveTo(L.pad + 2, 46, L.pad + 9, 38); ctx.fill();
  const segs = 10, gap = 2, sw1 = (bw0 - gap*(segs - 1))/segs;
  const fcol = pl.buffs.fuel > 0 ? '#ffd166' : pl.fuel > 25 ? '#6ee7ff' : '#ff6b81';
  for (let i = 0; i < segs; i++) {
    const fill = Math.max(0, Math.min(1, pl.fuel/10 - i));
    const sx2 = bx + i*(sw1 + gap);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx2, 40, sw1, 10);
    if (fill > 0) { ctx.fillStyle = fcol; ctx.fillRect(sx2, 40, sw1*fill, 10); }
  }

  // ---- weapon panel (top-right) ----
  const w = WEAPONS[pl.weapon];
  const rw = L.narrow ? 150 : 196, rx = W - L.pad - rw + 8;
  const hot = pl.buffs.damage > 0;
  glass(rx, 10, rw, 62, hot ? 'rgba(255,107,129,0.5)' : (WEAPON_TIER[pl.weapon] === 3 ? 'rgba(255,209,102,0.45)' : null));
  ctx.save();                                                // weapon silhouette
  ctx.translate(rx + 14, 28); ctx.scale(1.35, 1.35);
  weaponShape(pl.weapon, 0);
  ctx.restore();
  ctx.textAlign = 'right';
  ctx.fillStyle = hot ? '#ff6b81' : WEAPON_TIER[pl.weapon] === 3 ? '#ffd166' : '#eaf6ff';
  ctx.font = '700 ' + (L.narrow ? 12 : 14) + 'px ui-monospace, monospace';
  ctx.fillText(w.name + (hot ? ' x2' : ''), rx + rw - 10, 29);
  // ammo: pips for small mags, a count + bar for big ones
  const ay = 44;
  if (pl.reloading > 0) {
    const prog = 1 - pl.reloading / w.reload;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(rx + 10, ay - 4, rw - 20, 6);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(rx + 10, ay - 4, (rw - 20)*prog, 6);
    ctx.fillStyle = '#ffd166'; ctx.font = '600 9px ui-monospace, monospace';
    ctx.fillText('RELOADING', rx + rw - 10, ay + 14);
  } else if (w.mag <= 12) {
    const pipW = Math.min(10, (rw - 24)/w.mag - 2);
    for (let i = 0; i < w.mag; i++) {
      ctx.fillStyle = i < pl.ammo ? '#eaf6ff' : 'rgba(234,246,255,0.14)';
      ctx.fillRect(rx + rw - 10 - (i + 1)*(pipW + 2), ay - 5, pipW, 8);
    }
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(rx + 10, ay - 3, rw - 60, 4);
    ctx.fillStyle = pl.ammo / w.mag < 0.25 ? '#ff6b81' : '#eaf6ff';
    ctx.fillRect(rx + 10, ay - 3, (rw - 60)*pl.ammo/w.mag, 4);
    ctx.font = '700 12px ui-monospace, monospace';
    ctx.fillText(pl.ammo + '', rx + rw - 10, ay + 3);
  }
  for (let i = 0; i < pl.grenades; i++) {                   // grenade icons
    const gx = rx + rw - 16 - i*14, gy = 62;
    ctx.fillStyle = '#cfe3ff';
    ctx.beginPath(); ctx.arc(gx, gy, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7f8fb0'; ctx.fillRect(gx - 1.5, gy - 8, 3, 3);
  }
  ctx.textAlign = 'left';

  const sy = L.scoreY;
  ctx.textAlign = 'center';

  if (mode === 'sv') {
    const alive = players.filter(q => q.isBot && !q.gone && !q.dead).length;
    const cells = [
      ['WAVE', String(Math.max(1, sv.wave)), '#ffd166'],
      ['LIVES', String(Math.max(0, sv.lives)), '#ff6b81'],
      ['LEFT', String(alive), '#6ee7ff'],
      ['KILLS', String(pl.kills), '#9dffb0']
    ];
    const tw = L.narrow ? 58 : 76;
    cells.forEach((c, i) => {
      const x = W/2 - (cells.length*tw)/2 + i*tw + tw/2;
      ctx.fillStyle = 'rgba(7,11,20,0.62)'; roundRect(x - tw/2 + 4, sy, tw - 8, 40, 8); ctx.fill();
      ctx.fillStyle = c[2]; ctx.font = '600 ' + (L.narrow ? 9 : 11) + 'px ui-monospace, monospace';
      ctx.fillText(c[0], x, sy + 15);
      ctx.fillStyle = '#eaf6ff'; ctx.font = '600 16px ui-monospace, monospace';
      ctx.fillText(c[1], x, sy + 34);
    });
    ctx.fillStyle = 'rgba(234,246,255,0.4)'; ctx.font = '500 10px ui-monospace, monospace';
    ctx.fillText(sv.breather > 0 ? ('NEXT WAVE IN ' + sv.breather.toFixed(1) + 's')
                                 : (level.name + '  ·  SURVIVAL'), W/2, sy + 52);
    hudTail(pl);
    return;
  }

  const sorted = [...players].sort((a, b) => b.kills - a.kills);
  const tile = L.tile;
  sorted.forEach((q, i) => {
    const x = W/2 - (players.length*tile)/2 + i*tile + tile/2;
    ctx.fillStyle = 'rgba(7,11,20,0.62)'; roundRect(x - tile/2 + 4, sy, tile - 8, 40, 8); ctx.fill();
    ctx.fillStyle = q.color; ctx.font = '600 ' + (L.narrow ? 10 : 12) + 'px ui-monospace, monospace';
    ctx.fillText(q.name, x, sy + 16);
    ctx.fillStyle = '#eaf6ff'; ctx.font = '600 16px ui-monospace, monospace';
    ctx.fillText(String(q.kills), x, sy + 34);
  });
  ctx.fillStyle = 'rgba(234,246,255,0.4)'; ctx.font = '500 10px ui-monospace, monospace';
  ctx.fillText(level.name + '  ·  FIRST TO ' + level.target, W/2, sy + 52);
  hudTail(pl);
}

// shared between deathmatch and survival HUDs
function hudTail(pl) {
  ctx.textAlign = 'right'; ctx.font = '500 12px ui-monospace, monospace';
  const feedTop = L.narrow ? L.mini.y + L.mini.h + 22 : Math.max(110, L.scoreY + 72);
  feed.forEach((f, i) => {
    const y = feedTop + i*18;
    ctx.globalAlpha = Math.min(1, f.t);
    if (f.a) {
      ctx.fillStyle = f.ac; ctx.fillText(f.a, W - 118, y);
      ctx.fillStyle = 'rgba(234,246,255,0.55)'; ctx.fillText('fragged', W - 74, y);
      ctx.fillStyle = f.bc; ctx.fillText(f.b, W - L.pad, y);
    } else { ctx.fillStyle = f.bc; ctx.fillText(f.b, W - L.pad, y); }
    ctx.globalAlpha = 1;
  });

  if (streak.t > 0) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, streak.t*1.6);
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 ' + Math.round(30 + streak.t*6) + 'px ui-monospace, monospace';
    ctx.fillText(streak.text, W/2, H*0.3);
    ctx.globalAlpha = 1;
  }

  // one quiet status line tucked inside the bottom of the vitals panel
  ctx.textAlign = 'left';
  ctx.font = '500 9px ui-monospace, monospace';
  const lan = NET.role !== 'off';
  ctx.fillStyle = lan ? (NET.role === 'host' ? '#9dffb0' : '#6ee7ff') : 'rgba(234,246,255,0.38)';
  const status = (lan ? 'LAN ' + NET.role.toUpperCase() + ' ' + NET.count + 'P  ·  ' : '') +
                 DIFF().label + (SFX.isMuted() ? '  ·  MUTED' : '') + '  ·  P pause';
  ctx.fillText(status, L.pad + 2, 65, L.barW + 44);

  if (pl.dead && state === 'play') {
    const k = deathCam && !deathCam.p.gone ? deathCam.p : null;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(7,11,20,0.55)';
    roundRect(W/2 - 150, H/2 - 52, 300, 104, 12); ctx.fill();
    ctx.fillStyle = '#ff6b81'; ctx.font = '700 26px ui-monospace, monospace';
    ctx.fillText(mode === 'sv' && sv.lives <= 0 ? 'OVERRUN' : 'DOWN', W/2, H/2 - 20);
    if (k) {                                    // who got you, and how they're doing
      ctx.font = '500 13px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(234,246,255,0.55)';
      ctx.fillText('killed by', W/2, H/2 + 4);
      ctx.fillStyle = k.color; ctx.font = '700 17px ui-monospace, monospace';
      ctx.fillText(k.name + '   ' + Math.max(0, Math.ceil(k.hp)) + ' HP', W/2, H/2 + 25);
    }
    ctx.fillStyle = 'rgba(234,246,255,0.7)'; ctx.font = '500 13px ui-monospace, monospace';
    ctx.fillText((k ? 'watching them · ' : '') + 'back in ' + Math.max(0, pl.respawn).toFixed(1) + 's',
                 W/2, H/2 + 45);
  }

  damageArrows(pl);
  if (hintT > 0 && state === 'play') firstRunHints();

  minimap();
  if (state === 'play') controls();
}

// red wedges around you pointing at whoever is shooting
function damageArrows(pl) {
  if (!dmgArrows.length || pl.dead) return;
  const sx = (pl.x - cam.x - W/2)*cam.zoom + W/2;
  const sy = (pl.y - cam.y - H/2)*cam.zoom + H/2;
  for (const d of dmgArrows) {
    const f = Math.min(1, d.t / 1.2);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(d.a);
    ctx.globalAlpha = f * 0.85;
    const r0 = 58, r1 = 88;
    const g = ctx.createLinearGradient(r0, 0, r1, 0);
    g.addColorStop(0, 'rgba(255,60,90,0.85)');
    g.addColorStop(1, 'rgba(255,60,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(r0, -16); ctx.lineTo(r1, -4); ctx.lineTo(r1, 4); ctx.lineTo(r0, 16);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// shown once, on a player's very first match — friends open this cold on a
// phone and otherwise have no idea what the sticks do
function firstRunHints() {
  const fade = Math.min(1, hintT / 2);
  ctx.globalAlpha = fade;
  ctx.textAlign = 'center';
  ctx.font = '600 ' + (L.narrow ? 11 : 13) + 'px ui-monospace, monospace';

  const tag = (x, y, text, col) => {
    const w = ctx.measureText(text).width + 18;
    x = Math.max(w/2 + 8, Math.min(W - w/2 - 8, x));      // never run off the edge
    ctx.fillStyle = 'rgba(7,11,20,0.78)';
    roundRect(x - w/2, y - 14, w, 22, 8); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = col; ctx.fillText(text, x, y + 1);
  };

  // sit clear of the sticks and of the action buttons stacked above them
  const leftY = ui.stickL.cy - ui.stickL.r - 22;
  const rightY = Math.min(ui.btnM.y, ui.btnR.y, ui.btnG.y) - ui.btnG.r - 16;
  if (IS_TOUCH) {
    tag(ui.stickL.cx, leftY, 'push UP to fly', '#6ee7ff');
    tag(W - 90, rightY, 'drag to aim + fire', '#ffd166');
  } else {
    tag(ui.stickL.cx, leftY, 'A / D move · hold W to fly', '#6ee7ff');
    tag(W - 110, rightY, 'mouse aims · click fires', '#ffd166');
  }
  tag(W/2, L.scoreY + 86, 'gold crates = power weapons', '#ffd166');   // clear of the fight
  ctx.globalAlpha = 1;
}

function minimap() {
  const { x:mx, y:my, w:mw, h:mh } = L.mini;
  ctx.fillStyle = 'rgba(7,11,20,0.55)'; roundRect(mx, my, mw, mh, 8); ctx.fill();
  const s = mw / WORLD.w;
  ctx.fillStyle = 'rgba(110,231,255,0.20)';
  for (const pf of level.plats) ctx.fillRect(mx + pf.x*s, my + pf.y*s, Math.max(1, pf.w*s), Math.max(1, pf.h*s));
  ctx.fillStyle = 'rgba(255,140,60,0.5)';
  for (const lv of level.lava) ctx.fillRect(mx + lv.x*s, my + lv.y*s, Math.max(1, lv.w*s), Math.max(2, lv.h*s));
  // item spots worth routing to: power weapons (gold diamond) and power-ups;
  // bright when ready, faint while respawning
  for (const pk of pickups) {
    const isPow = pk.kind === 'gun' && pk.tier === 3;
    if (!isPow && pk.kind !== 'power') continue;
    const ix = mx + pk.x*s, iy = my + pk.y*s;
    ctx.globalAlpha = pk.ready ? (0.7 + 0.3*Math.sin(tGlobal*5)) : 0.22;
    ctx.fillStyle = isPow ? '#ffd166' : POWERS[pk.power].color;
    ctx.beginPath();
    if (isPow) { ctx.moveTo(ix, iy - 4); ctx.lineTo(ix + 4, iy); ctx.lineTo(ix, iy + 4); ctx.lineTo(ix - 4, iy); }
    else ctx.rect(ix - 2.5, iy - 2.5, 5, 5);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const pl of players) {
    if (pl.dead) continue;
    ctx.fillStyle = pl.color;
    ctx.beginPath(); ctx.arc(mx + pl.x*s, my + pl.y*s, pl.isBot ? 2.5 : 3.5, 0, Math.PI*2); ctx.fill();
  }
}

function controls() {
  const drawStick = (s, label) => {
    ctx.strokeStyle = 'rgba(110,231,255,0.28)'; ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(17,26,53,0.35)';
    ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = s.active ? 'rgba(110,231,255,0.75)' : 'rgba(110,231,255,0.35)';
    ctx.beginPath(); ctx.arc(s.cx + s.kx*s.r, s.cy + s.ky*s.r, s.r*0.36, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(234,246,255,0.35)'; ctx.font = '500 9px ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.fillText(label, s.cx, s.cy + s.r + 16);
  };
  drawStick(ui.stickL, 'MOVE / FLY');
  drawStick(ui.stickR, 'AIM + FIRE');
  const drawBtn = (b, text, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(17,26,53,0.55)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ctx.font = '600 10px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.fillText(text, b.x, b.y + 4);
  };
  drawBtn(ui.btnG, 'NADE', '#ffd166');
  drawBtn(ui.btnR, 'RELD', '#9dffb0');
  drawBtn(ui.btnM, 'HIT', me().mcool > 0 ? 'rgba(234,246,255,0.3)' : '#ff6b81');
  if (NET.role !== 'guest') drawBtn(ui.btnP, 'II', 'rgba(234,246,255,0.7)');
  drawBtn(ui.btnF, isFullscreen() ? '><' : '[ ]', 'rgba(234,246,255,0.7)');
}

function panel(title, lines, sub) {
  lines = lines.filter(l => l !== null && l !== undefined && l !== false);
  const k = Math.min(1, H/620);
  const lh = 24*k, top = H/2 - (lines.length*lh)/2 + 6;
  ctx.fillStyle = 'rgba(7,11,20,0.86)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6ee7ff'; ctx.font = '700 ' + Math.round(46*k) + 'px ui-monospace, monospace';
  ctx.fillText(title, W/2, top - 46*k);
  ctx.font = '500 ' + Math.round(14*k) + 'px ui-monospace, monospace';
  lines.forEach((l, i) => {
    ctx.fillStyle = i === 0 ? 'rgba(234,246,255,0.92)' : 'rgba(234,246,255,0.62)';
    ctx.fillText(l, W/2, top + i*lh);
  });
  ctx.fillStyle = '#ffd166'; ctx.font = '600 ' + Math.round(16*k) + 'px ui-monospace, monospace';
  ctx.fillText(sub, W/2, top + lines.length*lh + 26*k);
  return { top, lh, k };
}

function menuScreen() {
  const k = Math.min(1, H/680);
  menuHits = [];
  ctx.fillStyle = 'rgba(7,11,20,0.90)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  ctx.fillStyle = '#6ee7ff';
  ctx.font = '700 ' + Math.round(42*k) + 'px ui-monospace, monospace';
  ctx.fillText('JET ARENA', W/2, H*0.09 + 20*k);

  // ---------- helpers ----------
  const chip = (x, y, w, h, label, sub, on, act, accent) => {
    ctx.fillStyle = on ? 'rgba(110,231,255,0.18)' : 'rgba(17,26,53,0.62)';
    ctx.strokeStyle = on ? (accent || '#6ee7ff') : 'rgba(110,231,255,0.28)';
    ctx.lineWidth = on ? 2.5 : 1.5;
    roundRect(x, y, w, h, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = on ? '#eaf6ff' : 'rgba(234,246,255,0.6)';
    ctx.font = '600 ' + Math.round(12*k) + 'px ui-monospace, monospace';
    ctx.fillText(label, x + w/2, y + (sub ? h/2 - 2 : h/2 + 4), w - 10);
    if (sub) {
      ctx.fillStyle = 'rgba(234,246,255,0.45)';
      ctx.font = '500 ' + Math.round(9*k) + 'px ui-monospace, monospace';
      ctx.fillText(sub, x + w/2, y + h/2 + 12, w - 8);
    }
    if (act) menuHits.push({ x, y, w, h, act });
  };
  const row = (n, wEach, gap) => W/2 - (n*wEach + (n-1)*gap)/2;

  // ---------- corner toggles ----------
  const tw = Math.min(104, W*0.24), th = 24;
  chip(8, 6, tw, th, (isFullscreen() ? 'EXIT FULL' : 'FULLSCREEN'), null, isFullscreen(), 'fs');
  chip(W - tw - 8, 6, tw, th, 'MUSIC ' + (save.music ? 'ON' : 'OFF'), null, save.music, 'music');
  if (installEvt) chip(8, 6 + th + 6, tw, th, 'INSTALL APP', null, true, 'install', '#ffd166');

  // ---------- 0. pilot ----------
  let y = H*0.09 + 34*k;
  const nameW = Math.min(150, W*0.36), sw0 = Math.max(16, 20*k), gap0 = 6;
  const rowW = nameW + 12 + PALETTE.length*(sw0 + gap0) - gap0;
  let px = W/2 - rowW/2;
  ctx.fillStyle = 'rgba(17,26,53,0.7)'; ctx.strokeStyle = save.profile.color; ctx.lineWidth = 2;
  roundRect(px, y, nameW, sw0 + 6, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = save.profile.color;
  ctx.font = '700 ' + Math.round(12*k) + 'px ui-monospace, monospace';
  ctx.fillText(save.profile.name + '  ✎', px + nameW/2, y + (sw0 + 6)/2 + 4, nameW - 10);
  menuHits.push({ x: px, y, w: nameW, h: sw0 + 6, act: 'name' });
  px += nameW + 12;
  PALETTE.forEach((c, i) => {
    const cx0 = px + i*(sw0 + gap0) + sw0/2, cy0 = y + (sw0 + 6)/2;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(cx0, cy0, sw0/2 - 1, 0, Math.PI*2); ctx.fill();
    if (c === save.profile.color) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(cx0, cy0, sw0/2 + 2, 0, Math.PI*2); ctx.stroke();
    }
    menuHits.push({ x: cx0 - sw0/2 - 2, y, w: sw0 + 4, h: sw0 + 6, act: 'col-' + i });
  });

  // ---------- 1. connection ----------
  y += sw0 + 6 + 22*k;
  ctx.fillStyle = 'rgba(234,246,255,0.35)';
  ctx.font = '500 ' + Math.round(10*k) + 'px ui-monospace, monospace';
  ctx.fillText('HOW DO YOU WANT TO PLAY', W/2, y);
  y += 10*k;
  const cw = Math.min(150, (W - 60)/3 - 10), ch = 44*k;
  let x0 = row(3, cw, 10);
  chip(x0,              y, cw, ch, 'OFFLINE',   'just you + bots',  NET.role === 'off',   'net-off');
  chip(x0 + cw + 10,    y, cw, ch, 'HOST LAN',  'friends join you', NET.role === 'host',  'net-host', '#9dffb0');
  chip(x0 + 2*(cw+10),  y, cw, ch, 'JOIN LAN',  'someone is hosting', NET.role === 'guest', 'net-join', '#ffd166');

  y += ch + 8*k;
  ctx.font = '500 ' + Math.round(10*k) + 'px ui-monospace, monospace';
  ctx.fillStyle = NET.role === 'host' ? '#9dffb0' : NET.role === 'guest' ? '#ffd166' : 'rgba(234,246,255,0.45)';
  let netLine = NET.status;
  if (NET.role === 'host') netLine = 'HOSTING · ' + NET.count + ' connected' + (NET.lanUrl ? '  —  friends open  ' + NET.lanUrl : '');
  ctx.fillText(netLine, W/2, y + 10*k, W - 24);

  // who is in the lobby — the host sees its own roster, guests see the host's
  const roster = NET.role === 'host' ? lobbyList() : NET.role === 'guest' ? NET.lobby : [];
  const drawRoster = (ry) => {
    if (!roster.length) return;
    ctx.font = '600 ' + Math.round(11*k) + 'px ui-monospace, monospace';
    const parts2 = roster.map(r => r[0]);
    const widths = parts2.map(t => ctx.measureText(t).width + 22);
    const total = widths.reduce((a, b) => a + b, 0);
    let rx = W/2 - Math.min(total, W - 20)/2;
    roster.forEach((r, i) => {
      if (rx + widths[i] > W - 6) return;
      ctx.fillStyle = r[1];
      ctx.beginPath(); ctx.arc(rx + 6, ry - 4, 5, 0, Math.PI*2); ctx.fill();
      ctx.textAlign = 'left'; ctx.fillText(r[0], rx + 14, ry);
      rx += widths[i];
    });
    ctx.textAlign = 'center';
  };

  if (NET.role === 'guest') {                       // guests don't choose anything
    ctx.fillStyle = 'rgba(234,246,255,0.45)';
    ctx.font = '500 ' + Math.round(10*k) + 'px ui-monospace, monospace';
    ctx.fillText(roster.length ? 'IN THE LOBBY' : '', W/2, H*0.5 - 44*k);
    drawRoster(H*0.5 - 22*k);
    ctx.fillStyle = 'rgba(234,246,255,0.75)';
    ctx.font = '500 ' + Math.round(13*k) + 'px ui-monospace, monospace';
    ctx.fillText('the host picks the arena — you will drop in automatically', W/2, H*0.5 + 10*k, W - 24);
    ctx.fillStyle = '#ffd166';
    ctx.font = '600 ' + Math.round(15*k) + 'px ui-monospace, monospace';
    ctx.fillText('waiting for the host…', W/2, H*0.5 + 40*k);
    return;
  }
  if (NET.role === 'host') { y += 18*k; drawRoster(y + 10*k); }

  // ---------- 2. mode ----------
  y += 26*k;
  const mw = Math.min(150, (W - 60)/2 - 10);
  x0 = row(2, mw, 10);
  chip(x0,           y, mw, ch, 'DEATHMATCH', LEVELS[menuSel].bots + ' bots · first to ' + LEVELS[menuSel].target, mode === 'dm', 'mode-dm');
  chip(x0 + mw + 10, y, mw, ch, 'SURVIVAL',   'endless waves · 3 lives', mode === 'sv', 'mode-sv');

  // ---------- 3. arena ----------
  y += ch + 18*k;
  ctx.fillStyle = 'rgba(234,246,255,0.35)';
  ctx.font = '500 ' + Math.round(10*k) + 'px ui-monospace, monospace';
  ctx.fillText('ARENA', W/2, y);
  y += 10*k;
  const aw = Math.min(132, (W - 50)/LEVELS.length - 8), ah = 74*k;
  x0 = row(LEVELS.length, aw, 8);
  LEVELS.forEach((lv, i) => {
    const x = x0 + i*(aw + 8), locked = i >= save.unlocked, on = i === menuSel;
    ctx.fillStyle = on ? 'rgba(110,231,255,0.16)' : 'rgba(17,26,53,0.62)';
    ctx.strokeStyle = locked ? 'rgba(234,246,255,0.12)' : on ? '#6ee7ff' : 'rgba(110,231,255,0.3)';
    ctx.lineWidth = on ? 2.5 : 1.5;
    roundRect(x, y, aw, ah, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = locked ? 'rgba(234,246,255,0.28)' : '#eaf6ff';
    ctx.font = '600 ' + Math.round(11*k) + 'px ui-monospace, monospace';
    ctx.fillText(locked ? 'LOCKED' : lv.name, x + aw/2, y + 20*k, aw - 10);
    ctx.fillStyle = 'rgba(234,246,255,0.45)';
    ctx.font = '500 ' + Math.round(9*k) + 'px ui-monospace, monospace';
    if (locked) {
      ctx.fillText('win ' + LEVELS[i-1].name, x + aw/2, y + 40*k, aw - 10);
    } else {
      ctx.fillText(lv.grav !== 1 ? 'LOW-G' : lv.lava.length ? 'LAVA' : 'CLEAN', x + aw/2, y + 38*k);
      const bw2 = save.bestWave[i] || 0;
      ctx.fillText(mode === 'sv' && bw2 ? 'best wave ' + bw2 : lv.sub, x + aw/2, y + 54*k, aw - 10);
    }
    if (!locked) menuHits.push({ x, y, w:aw, h:ah, act:'lvl-' + i });
  });

  // ---------- 4. bot skill ----------
  y += ah + 16*k;
  ctx.fillStyle = 'rgba(234,246,255,0.35)';
  ctx.font = '500 ' + Math.round(10*k) + 'px ui-monospace, monospace';
  ctx.fillText('BOT SKILL', W/2, y);
  y += 8*k;
  const dw = Math.min(110, (W - 60)/3 - 8), dh = 30*k;
  x0 = row(3, dw, 8);
  ['easy','normal','hard'].forEach((dk, i) => {
    chip(x0 + i*(dw + 8), y, dw, dh, DIFFS[dk].label, null, diffKey === dk, 'diff-' + dk);
  });

  // ---------- 5. start ----------
  y += dh + 22*k;
  const sw = Math.min(260, W - 80), sh = 46*k;
  ctx.fillStyle = 'rgba(255,209,102,0.18)'; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5;
  roundRect(W/2 - sw/2, y, sw, sh, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd166'; ctx.font = '700 ' + Math.round(17*k) + 'px ui-monospace, monospace';
  ctx.fillText(NET.role === 'host' ? 'START MATCH' : 'PLAY', W/2, y + sh/2 + 6);
  menuHits.push({ x: W/2 - sw/2, y, w:sw, h:sh, act:'start' });

  // ---------- controls footnote ----------
  y += sh + 20*k;
  ctx.fillStyle = 'rgba(234,246,255,0.45)';
  ctx.font = '500 ' + Math.round(11*k) + 'px ui-monospace, monospace';
  const foot = [
    'A/D move · hold W or SPACE to fly · mouse aims · click fires',
    'G nade   R reload   F melee   P pause   M mute',
    'crates: SMG · SHOTGUN · SNIPER · ROCKET · MINIGUN · RAILGUN',
    'SPACE starts · arrows pick arena · 1/2/3 bot skill · graphics ' + QNAMES[Q.level]
  ];
  foot.forEach((t, i) => { if (y + i*15*k < H - 8) ctx.fillText(t, W/2, y + i*15*k, W - 24); });
}

function overScreen() {
  const you = me();
  const acc = stats.shots ? Math.round(stats.hits / stats.shots * 100) : 0;
  const statLines = [
    'kills ' + you.kills + '    accuracy ' + acc + '%    damage ' + Math.round(stats.dmg),
    'best streak ' + stats.bestStreak
  ];

  if (mode === 'sv') {
    const reached = Math.max(1, sv.wave);
    const bw = save.bestWave[levelIndex] || 0;
    panel('OVERRUN', [
      'you held ' + level.name + ' for ' + (reached - 1) + ' wave' + (reached - 1 === 1 ? '' : 's'),
      '',
      ...statLines,
      '',
      'best on this arena: wave ' + bw
    ], 'click or press SPACE for the arena list');
    return;
  }

  const sorted = [...players].sort((a, b) => b.kills - a.kills);
  const won = matchOver === you;
  const nextUnlocked = won && levelIndex + 1 < LEVELS.length;
  panel(won ? 'VICTORY' : 'DEFEAT', [
    won ? 'you took ' + level.name : matchOver.name + ' took ' + level.name,
    '',
    ...sorted.map(q => q.name + '  ' + q.kills + ' kills  ' + q.deaths + ' deaths'),
    '',
    ...statLines,
    '',
    nextUnlocked ? (LEVELS[levelIndex+1].name + ' UNLOCKED') : (won ? 'all arenas cleared' : null),
    'best: ' + save.best + ' kills'
  ], 'click or press SPACE for the arena list');
}

function pauseScreen() {
  panel('PAUSED', [
    level.name + '  ·  bots: ' + DIFF().label,
    '',
    'P or ESC   resume',
    'M          sound ' + (SFX.isMuted() ? 'OFF' : 'ON'),
    'ENTER      restart match'
  ], 'press P to get back in');
}

// ==================================================================
// LOOP
// ==================================================================
let prev = performance.now();
let frameErrors = 0;
function frame(now) {
  // schedule first: one bad frame must never stop the game for good
  requestAnimationFrame(frame);
  const real = Math.min(0.04, (now - prev)/1000);
  prev = now;
  if (!W || !H) return;                  // window hidden — wait for a real size
  const t0 = performance.now();
  try {
    update(real * timeScale);
    draw();
  } catch (err) {
    if (frameErrors++ < 3) console.error('[jet arena] frame error', err);
  }
  tuneQuality(performance.now() - t0);
}

resize();
loadLevel(0);
resetMatch();
state = 'menu';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
