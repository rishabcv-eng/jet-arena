  return pool[(Math.max(1, i) - 1) % pool.length];

// ==================================================================
// SOUND — synthesized, no asset files
// ==================================================================
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, jetGain = null, muted = false, voices = 0;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.3; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, (ac.sampleRate * 0.6) | 0, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 780;
    jetGain = ac.createGain(); jetGain.gain.value = 0;
    src.connect(lp); lp.connect(jetGain); jetGain.connect(master);
    src.start();
  }
  const ok = () => ac && !muted && voices < 24;

  function tone(freq, dur, type, vol, slideTo) {
    if (!ok()) return;
    voices++;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + dur);
    o.onended = () => voices--;
  }
  function noise(dur, vol, freq, sweepTo, q) {
    if (!ok()) return;
    voices++;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.setValueAtTime(freq, ac.currentTime); f.Q.value = q || 1.2;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), ac.currentTime + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(ac.currentTime + dur);
    s.onended = () => voices--;
  }

  // ---- music: a tiny look-ahead step sequencer --------------------------
  // Minor-key loop (i - VI - III - VII) with a triangle bass, square arpeggio,
  // and kick/hat that only come in during a match. Each arena has its own key
  // and tempo. Music notes don't count against the SFX voice cap.
  let musicOn = false, musicGain = null, seqTimer = null, nextT = 0, step = 0;
  const song = { root: 57, bpm: 112, hot: 0 };
  const PROG = [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function mnote(t, freq, dur, type, vol, cutoff) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    let node = o;
    if (cutoff) {
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
      o.connect(f); node = f;
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function mkick(t, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.18);
  }
  function mhat(t, vol) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(musicGain); s.start(t, Math.random()*0.4); s.stop(t + 0.06);
  }
  function schedule() {
    if (!ac || !musicOn) return;
    const spb = 60 / song.bpm / 4;                         // one 16th note
    if (nextT < ac.currentTime - 0.1) nextT = ac.currentTime + 0.05;   // tab was asleep
    while (nextT < ac.currentTime + 0.18) {
      const bar = Math.floor(step / 16) % 4, s16 = step % 16;
      const off = PROG[bar][0], tri = PROG[bar][1] === 'm' ? [0, 3, 7, 12] : [0, 4, 7, 12];
      const root = song.root + off;
      if (s16 % 2 === 0) mnote(nextT, mtof(root - 12 + (s16 % 8 === 6 ? 12 : 0)), spb*1.8, 'triangle', 0.16, 0);
      if (song.hot || s16 % 2 === 0) {
        mnote(nextT, mtof(root + 12 + tri[[0, 1, 2, 1, 3, 2, 1, 2][s16 % 8]]), spb*0.9, 'square', 0.035, 2200);
      }
      if (song.hot) {
        if (s16 % 4 === 0) mkick(nextT, 0.22);
        if (s16 % 4 === 2) mhat(nextT, 0.05);
      }
      nextT += spb; step++;
    }
  }
  function applyMusicGain() {
    if (musicGain) musicGain.gain.setTargetAtTime(musicOn && !muted ? 0.55 : 0, ac.currentTime, 0.3);
  }
  function music(on) {
    musicOn = !!on;
    if (!ac) return;
    if (!musicGain) { musicGain = ac.createGain(); musicGain.gain.value = 0; musicGain.connect(master); }
    applyMusicGain();
    if (musicOn && !seqTimer) { nextT = ac.currentTime + 0.05; seqTimer = setInterval(schedule, 40); }
    if (!musicOn && seqTimer) { clearInterval(seqTimer); seqTimer = null; }
  }

  return {
    init() { const fresh = !ac; init(); if (fresh && ac) music(save.music); },
    music,
    setSong(root, bpm, hot) { song.root = root; song.bpm = bpm; song.hot = hot; },
    toggleMute() {
      init(); muted = !muted;
      if (muted && jetGain) jetGain.gain.value = 0;
      applyMusicGain();
      return muted;
    },
    isMuted: () => muted,
    shot(w, v) {
      if (v <= 0.02) return;
      if (w === 'shotgun')      { noise(0.20, 0.42*v, 900, 180); tone(120, 0.14, 'square', 0.16*v, 55); }
      else if (w === 'sniper')  { noise(0.26, 0.40*v, 2400, 300); tone(240, 0.20, 'sawtooth', 0.14*v, 70); }
      else if (w === 'rocket')  { noise(0.34, 0.34*v, 420, 120); tone(180, 0.30, 'sawtooth', 0.16*v, 60); }
      else if (w === 'minigun') { noise(0.05, 0.22*v, 1800, 800); tone(420, 0.035, 'square', 0.08*v, 200); }
      else if (w === 'smg')     { noise(0.06, 0.26*v, 1500, 700); tone(340, 0.045, 'square', 0.10*v, 180); }
      else                      { noise(0.09, 0.30*v, 1200, 500); tone(300, 0.07, 'square', 0.12*v, 120); }
    },
    boom(v)  { noise(0.55, 0.60*v, 380, 60, 0.8); tone(90, 0.45, 'sine', 0.30*v, 32); },
    hit(v)   { tone(720, 0.05, 'square', 0.16*v, 380); },
    hurt()   { noise(0.18, 0.35, 500, 160); tone(160, 0.16, 'sawtooth', 0.18, 70); },
    die(v)   { tone(320, 0.45, 'sawtooth', 0.22*v, 60); noise(0.4, 0.28*v, 600, 90); },
    pick()   { tone(660, 0.07, 'square', 0.16); setTimeout(() => tone(990, 0.09, 'square', 0.16), 70); },
    power()  { [523,784,1047].forEach((f,i) => setTimeout(() => tone(f, 0.12, 'square', 0.17), i*70)); },
    zap()    { tone(1200, 0.18, 'sine', 0.18, 200); noise(0.2, 0.2, 2000, 400); },
    ui()     { tone(520, 0.06, 'square', 0.14, 700); },
    win()    { [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f, 0.18, 'square', 0.18), i*110)); },
    lose()   { [392,330,262,196].forEach((f,i) => setTimeout(() => tone(f, 0.22, 'sawtooth', 0.16), i*130)); },
    jet(on, v) { if (!ac || muted || !jetGain) return; jetGain.gain.setTargetAtTime(on ? 0.10*v : 0, ac.currentTime, 0.05); }
  };
})();

// p(x,y,w,h) shorthand keeps the layouts readable

// it(x, y, what): a fixed item spot — the same item always spawns in the same
// place, so learning the map (and timing the respawns) is how you win.
// Stronger items take longer to come back.
const WEAPON_TIER = { smg: 1, shotgun: 2, sniper: 2, rocket: 3, minigun: 3, rail: 3 };
const TIER_RESPAWN = { 1: 8, 2: 15, 3: 30 };
function it(x, y, give) {
  if (give === 'med') return { x, y, kind: 'med', tier: 1, every: 12 };
  if (POWERS[give]) {
    return { x, y, kind: 'power', power: give, tier: 2,
             every: give === 'shield' || give === 'damage' ? 30 : 22 };
  }
  const tier = WEAPON_TIER[give] || 1;
  return { x, y, kind: 'gun', gun: give, tier, every: TIER_RESPAWN[tier] };
}

function resize() {

  W = window.innerWidth; H = window.innerHeight;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

window.addEventListener('resize', resize);

const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
let dmgArrows = [];        // incoming-fire markers: {a: angle to attacker, t}
let deathCam = null;       // after you die, watch whoever got you
let hintT = 0;             // first-match control hints
let myIdx = 0;                                   // which slot the local human drives
const me = () => players[myIdx] || players[0];
const GRAV = () => GRAVITY * level.grav;

function volAt(x, y) {
  if (!players.length) return 0;
  return Math.max(0, 1 - Math.hypot(x - me().x, y - me().y) / 1500);
}
function floater(x, y, text, color, big) {
  floaters.push({ x, y, vy:-60, text, color, life: big ? 1.1 : 0.75, big: !!big });
}

// ==================================================================
function makePlayer(i, isBot) {
  const s = spawns[(i * 3) % spawns.length];
  return {
    i, isBot,
    name:  i === 0 ? save.profile.name  : botName(i),
    color: i === 0 ? save.profile.color : botColor(i),
    x: s[0], y: s[1], vx:0, vy:0,
    hp:100, hpMax:100, fuel:100, onGround:false, face:1, aim:0, standPlat:null,
    mcool:0, gone:false, skill:0,
    weapon:'pistol', ammo:WEAPONS.pistol.mag, reloading:0, cool:0,
    kills:0, deaths:0, dead:false, respawn:0, guard:SPAWN_GUARD,
    jetting:false, grenades:3, gcool:0, portalCool:0,
    shield:0, buffs:{ damage:0, speed:0, fuel:0 },
    anim: { walk:0, lean:0, squash:0, recoil:0, flash:0, melee:0, wasAir:false },
    bt: { target:null, think:0, strafe:1, wantJet:false, react:0, roam:0 }
  };
}

// everyone human who is currently seated, host first
function lobbyList() {
  return players.filter(p => !p.isBot && !p.gone).map(p => [p.name, p.color]);
}

// bots wear whatever colours the humans left free, so a friend is never
// mistaken for a bot mid-fight
function recolorBots() {
  const human = new Set(players.filter(p => !p.isBot && !p.gone).map(p => p.color));
  const free = PALETTE.filter(c => !human.has(c));
  let k = 0;
  for (const p of players) if (p.isBot) p.color = free[k++ % free.length];
}

function loadLevel(idx) {
  levelIndex = Math.max(0, Math.min(LEVELS.length - 1, idx));
  level = LEVELS[levelIndex];
  WORLD = { w: level.w, h: level.h };
  spawns = level.spawns;
  level.movers.forEach(m => { m.t = m.t || 0; });
  platforms = level.plats.concat(level.movers);
}

function resetMatch() {
  loadLevel(levelIndex);
  players = [];
  players.push(makePlayer(0, false));
  if (mode === 'dm') {
    for (let i = 1; i <= level.bots; i++) players.push(makePlayer(i, true));
  }
  if (NET.role === 'host' && NET.guests.length) {          // keep joined friends in the match
    NET.slotOf = {};
    const ids = NET.guests.slice();
    NET.guests = [];
    for (const gid of ids) NET.addRemote(gid);
  }
  recolorBots();
  sv = { wave:0, lives:3, breather: mode === 'sv' ? 2.2 : 0, over:false };
  stats = { shots:0, hits:0, dmg:0, bestStreak:0 };

  bullets = []; grenades = []; parts = []; feed = []; floaters = [];
  corpses = []; waves = []; casings = []; drops = []; beams = []; decals = []; lights = []; fireballs = [];
  streak = { n:0, t:0, text:'' };
  hitMark = 0; hurtFlash = 0; shake = 0; flashWhite = 0;
  dmgArrows = []; deathCam = null;
  hintT = save.tutorialSeen ? 0 : 14;          // first match ever: show the controls
  timeScale = 1; slowT = 0; pendingOver = null; matchOver = null;

  // every item starts on its designed spot; nothing is random
  pickups = level.items.map(s => Object.assign({ t:0, ready:true, respawn:0 }, s));

  cam.x = players[0].x - W/2; cam.y = players[0].y - H/2; cam.zoom = 1; cam.tzoom = 1;
}

// ==================================================================
// LAN NETPLAY
// Whoever opens the page first is the host: their browser runs the whole
// simulation (physics, bots, pickups) and broadcasts snapshots. Guests send
// only their input, predict their own movement locally so controls feel
// instant, and interpolate everyone else between snapshots.
// ==================================================================
const NET = {
  ws: null, role: 'off', id: null, count: 0,
  sendAcc: 0, snapAcc: 0,
  SNAP_HZ: 1/20, IN_HZ: 1/30,
  inputs: {},                 // host: latest input per remote id
  slotOf: {},                 // host: netId -> player index
  guests: [],                 // host: ids currently connected
  hasSlot: false,             // guest: has the host given us a player yet
  who: {},                    // host: netId -> { name, color } the guest chose
  lobby: [],                  // guest: [name, color] of everyone the host has seated
  lobbyAcc: 0,
  fxQueue: [], status: 'offline', lanUrl: '',

  want: 'host',
  disconnect() {
    this.role = 'off'; this.status = 'offline'; this.hasSlot = false;
    this.guests = []; this.slotOf = {}; this.inputs = {}; this.who = {}; this.lobby = [];
    if (this.ws) { try { this.ws.close(); } catch (e) {} this.ws = null; }
  },
  connect(want) {
    this.want = want;
    if (location.protocol === 'file:') {
      this.status = 'LAN needs the server — run play.bat and open the printed address';
      return;
    }
    this.disconnect();
    let ws;
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    } catch (e) { this.status = 'could not reach the server'; return; }
    this.ws = ws;
    this.status = want === 'host' ? 'starting host…' : 'looking for a host…';
    ws.onopen = () => this.send({ t:'role', want, name: save.profile.name, color: save.profile.color });
    ws.onclose = () => {
      if (this.role !== 'off') this.status = 'disconnected';
      this.role = 'off'; this.hasSlot = false; this.ws = null;
    };
    ws.onerror = () => { this.status = 'could not reach the server'; };
    ws.onmessage = ev => { try { this.onMsg(JSON.parse(ev.data)); } catch (e) {} };

    fetch('/lan').then(r => r.json()).then(j => {
      const a = (j.addresses || [])[0];
      if (a) this.lanUrl = 'http://' + a.address + ':' + j.port;
    }).catch(() => {});
  },

  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); },
  // pushed on every join / leave / rename, so it never depends on the host's
  // frame loop running (a backgrounded tab stops animating)
  sendLobby() { if (this.role === 'host') this.send({ t:'lobby', list: lobbyList() }); },

  onMsg(m) {
    if (m.t === 'hello')  { this.id = m.id; return; }
    if (m.t === 'role-ok') {
      this.role = m.role;
      this.status = m.role === 'host'
        ? 'hosting — friends can join now'
        : (m.hostPresent ? 'joined — waiting for the host to start' : 'waiting for someone to host…');
      return;
    }
    if (m.t === 'denied') {
      this.role = 'off';
      this.status = m.why === 'host-exists'
        ? 'someone is already hosting — pick JOIN'
        : 'could not join';
      if (this.ws) { try { this.ws.close(); } catch (e) {} this.ws = null; }
      return;
    }
    if (m.t === 'host-gone') {
      this.role = 'off'; this.hasSlot = false;
      this.status = 'the host left the game';
      state = 'menu';
      if (this.ws) { try { this.ws.close(); } catch (e) {} this.ws = null; }
      return;
    }
    if (m.t === 'count') { this.count = m.count; return; }

    if (this.role === 'host') {
      if (m.t === 'join')  { this.addRemote(m.id, m.name, m.color); return; }
      if (m.t === 'leave') { this.dropRemote(m.id); return; }
      if (m.t === 'in')    { this.inputs[m.id] = m.d; return; }
      return;
    }

    // ---- guest ----
    if (m.t === 'lvl') {
      if (m.i !== levelIndex || m.m !== mode) {
        mode = m.m; levelIndex = m.i;
        loadLevel(levelIndex); layoutControls();
      }
      return;
    }
    if (m.t === 'fx') { this.playFx(m.d); return; }
    if (m.t === 'lobby') { this.lobby = m.list || []; return; }
    if (m.t === 'sn') {
      if (state !== 'play') { state = 'play'; paused = false; this.status = 'in match'; }
      this.applySnap(m.d); return;
    }
  },

  // --- host side -------------------------------------------------
  addRemote(netId, name, color) {
    if (this.guests.indexOf(netId) < 0) this.guests.push(netId);
    // remember who they are so a match restart re-seats them the same way
    if (name) this.who[netId] = { name: cleanName(name), color };
    const who = this.who[netId] || { name: botName(players.length), color: null };
    const idx = players.length;
    const p = makePlayer(idx, false);
    p.isRemote = true; p.netId = netId;
    p.name = who.name;
    // people keep their chosen colour unless another *person* already wears it;
    // bots get recoloured around the humans afterwards
    const taken = new Set(players.filter(q => !q.gone && !q.isBot).map(q => q.color));
    p.color = (who.color && !taken.has(who.color)) ? who.color
            : (PALETTE.find(c => !taken.has(c)) || botColor(idx));
    // drop them at the spawn furthest from everyone already in the arena
    let bestS = spawns[0], bestD = -1;
    for (const s of spawns) {
      let near = 1e9;
      for (const q of players) if (!q.dead) near = Math.min(near, Math.hypot(s[0] - q.x, s[1] - q.y));
      if (near > bestD) { bestD = near; bestS = s; }
    }
    p.x = bestS[0]; p.y = bestS[1];
    players.push(p);
    this.slotOf[netId] = idx;
    this.inputs[netId] = { mx:0, up:0, fire:0, aim:0 };
    recolorBots();
    feed.unshift({ t:3.5, a:'', ac:'#888', b: p.name + ' joined', bc: p.color });
    SFX.pick();
    this.sendLobby();
  },
  dropRemote(netId) {
    const idx = this.slotOf[netId];
    if (idx === undefined || !players[idx]) return;
    const p = players[idx];
    feed.unshift({ t:3.5, a:'', ac:'#888', b: p.name + ' left', bc: p.color });
    p.dead = true; p.gone = true; p.isRemote = false;
    delete this.slotOf[netId];
    delete this.inputs[netId];
    this.guests = this.guests.filter(g => g !== netId);
    this.sendLobby();
  },
  snapshot() {
    return {
      ps: players.map(p => [
        Math.round(p.x), Math.round(p.y), Math.round(p.vx), Math.round(p.vy),
        +p.aim.toFixed(2), Math.round(p.hp), Math.round(p.fuel), p.weapon,
        p.dead ? 1 : 0, p.kills, p.jetting ? 1 : 0, Math.round(p.shield),
        p.onGround ? 1 : 0, p.netId || 0, p.name, p.color, Math.round(p.hpMax),
        p.ammo, p.gone ? 1 : 0
      ]),
      bs: bullets.map(b => [Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy), b.rocket ? 1 : 0, b.color]),
      pk: pickups.map(k => [Math.round(k.x), Math.round(k.y), k.ready ? 1 : 0, k.kind, k.gun || k.power || '',
                            k.tier || 1, Math.ceil(k.respawn || 0), k.temp ? 1 : 0]),
      gr: grenades.map(g => [Math.round(g.x), Math.round(g.y)]),
      sv: mode === 'sv' ? [sv.wave, sv.lives, +sv.breather.toFixed(1)] : null,
      fd: feed.slice(0, 4).map(f => [f.a, f.ac, f.b, f.bc, +f.t.toFixed(1)])
    };
  },

  // --- guest side ------------------------------------------------
  applySnap(s) {
    // grow/shrink the local roster to match the host
    while (players.length < s.ps.length) {
      const p = makePlayer(players.length, false);
      p.isRemote = true;
      players.push(p);
    }
    players.length = s.ps.length;

    this.hasSlot = false;
    s.ps.forEach((a, i) => {
      const p = players[i];
      p.netId = a[13]; p.name = a[14]; p.color = a[15];
      p.hpMax = a[16] || 100;
      const mine = p.netId === this.id;
      if (mine) { myIdx = i; this.hasSlot = true; }
      if (mine) {
        // our own slot: keep local prediction, nudge toward the host's truth
        const err = Math.hypot(a[0] - p.x, a[1] - p.y);
        if (err > 90) { p.x = a[0]; p.y = a[1]; p.vx = a[2]; p.vy = a[3]; }
        else { p.x += (a[0] - p.x)*0.18; p.y += (a[1] - p.y)*0.18; }
        p.hp = a[5]; p.fuel = a[6]; p.weapon = a[7]; p.dead = !!a[8];
        p.kills = a[9]; p.shield = a[11]; p.ammo = a[17];
      } else {
        p.nx = a[0]; p.ny = a[1];                    // interpolation targets
        if (p.x === 0 && p.y === 0) { p.x = a[0]; p.y = a[1]; }
        p.vx = a[2]; p.vy = a[3]; p.aim = a[4];
        p.hp = a[5]; p.fuel = a[6]; p.weapon = a[7]; p.dead = !!a[8];
        p.kills = a[9]; p.jetting = !!a[10]; p.shield = a[11]; p.onGround = !!a[12];
        p.ammo = a[17];
      }
      p.gone = !!a[18];
      p.isRemote = !mine;
      p.isBot = false;
    });

    bullets = s.bs.map(b => ({ x:b[0], y:b[1], vx:b[2], vy:b[3], rocket:!!b[4], color:b[5], dmg:0, owner:-1, life:2, smoke:0 }));
    grenades = s.gr.map(g => ({ x:g[0], y:g[1], vx:0, vy:0, t:1, owner:-1, rot:0 }));
    s.pk.forEach((k, i) => {
      if (!pickups[i]) pickups[i] = { kind:k[3], x:k[0], y:k[1], t:0, respawn:0 };
      pickups[i].x = k[0]; pickups[i].y = k[1]; pickups[i].ready = !!k[2]; pickups[i].kind = k[3];
      if (k[3] === 'gun') pickups[i].gun = k[4]; else if (k[3] === 'power') pickups[i].power = k[4];
      pickups[i].tier = k[5] || 1; pickups[i].respawn = k[6] || 0; pickups[i].temp = !!k[7];
    });
    pickups.length = s.pk.length;
    if (s.sv) { sv.wave = s.sv[0]; sv.lives = s.sv[1]; sv.breather = s.sv[2]; }
    feed = s.fd.map(f => ({ a:f[0], ac:f[1], b:f[2], bc:f[3], t:f[4] }));
  },

  playFx(d) {
    if (d.k === 'shot') {
      const mx = d.x + Math.cos(d.a)*26, my = d.y + Math.sin(d.a)*26;
      spark(mx, my, 4, '#fff3c4', 260);
      SFX.shot(d.w, volAt(d.x, d.y));
      const p = players[d.i];
      if (p) p.anim.recoil = 1;
    } else if (d.k === 'boom') {
      boomVisual(d.x, d.y, d.r);
      SFX.boom(Math.max(0.15, volAt(d.x, d.y)));
      const dme = Math.hypot(me().x - d.x, me().y - d.y);
      if (dme < 700) shake = Math.min(28, shake + 22*(1 - dme/700));
    } else if (d.k === 'die') {
      corpses.push({ x:d.x, y:d.y, vx:0, vy:-260, rot:0, vr:(Math.random()-0.5)*14, color:d.c, life:3.2 });
      spark(d.x, d.y, 20, d.c, 420);
      SFX.die(volAt(d.x, d.y));
    } else if (d.k === 'beam') {
      beams.push({ x1:d.x, y1:d.y, x2:d.x2, y2:d.y2, life:1, color:d.c });
      SFX.shot('sniper', volAt(d.x, d.y));
    }
  },
  fx(d) { if (this.role === 'host' && this.count > 1) this.send({ t:'fx', d }); }
};

const L = { narrow:false, barW:180, tile:74, scoreY:16, mini:{x:0,y:0,w:0,h:0}, pad:26 };
let menuHits = [];            // [{x,y,w,h,act}] rebuilt every time the menu draws
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function layoutControls() {
  const narrow = W < 780;
  L.narrow = narrow; L.pad = narrow ? 14 : 26;
  L.barW = narrow ? 118 : 180; L.tile = narrow ? 54 : 74;
  const r = narrow ? 54 : 74;
  ui.stickL.r = ui.stickR.r = r;
  const bottom = H - (narrow ? 76 : 116);
  ui.stickL.cx = L.pad + r + 6;     ui.stickL.cy = bottom;
  ui.stickR.cx = W - L.pad - r - 6; ui.stickR.cy = bottom;
  ui.btnG.r = narrow ? 27 : 34; ui.btnR.r = narrow ? 24 : 30; ui.btnM.r = narrow ? 24 : 30;
  ui.btnG.x = W - L.pad - ui.btnG.r - 10;             ui.btnG.y = bottom - r - ui.btnG.r - 18;
  ui.btnR.x = ui.btnG.x - ui.btnG.r - ui.btnR.r - 16; ui.btnR.y = ui.btnG.y + (narrow ? 26 : 34);
  ui.btnM.x = ui.btnR.x - ui.btnR.r - ui.btnM.r - 14; ui.btnM.y = ui.btnR.y + (narrow ? 20 : 26);
  // pause + fullscreen sit above the move stick, where thumbs rarely rest
  ui.btnP.r = ui.btnF.r = narrow ? 17 : 20;
  ui.btnP.x = ui.stickL.cx - ui.btnP.r - 6;  ui.btnP.y = ui.stickL.cy - r - ui.btnP.r - 26;
  ui.btnF.x = ui.stickL.cx + ui.btnF.r + 6;  ui.btnF.y = ui.btnP.y;
  // the scoreboard sits between the two HUD panels when there's room for a
  // full 6-pilot roster; otherwise it drops underneath them
  const leftEdge  = L.pad - 8 + L.barW + 66 + 10;
  const rightEdge = W - L.pad - (narrow ? 150 : 196) + 8 - 10;
  const rosterW = 6 * L.tile;
  L.scoreY = narrow ? 106 : (W/2 - rosterW/2 < leftEdge || W/2 + rosterW/2 > rightEdge) ? 82 : 16;
  const mw = narrow ? Math.min(160, W*0.44) : Math.min(190, W*0.26);
  const mh = mw * (WORLD.h / WORLD.w);
  L.mini = { w:mw, h:mh, x: W/2 - mw/2, y: narrow ? L.scoreY + 66 : H - mh - 16 };
}

const stickHit = (s, x, y) => Math.hypot(x - s.cx, y - s.cy) < s.r * 1.65;
const btnHit   = (b, x, y) => Math.hypot(x - b.x,  y - b.y)  < b.r * 1.5;

// screen -> world, accounting for camera zoom
function toWorld(sx, sy) {
  return { x: (sx - W/2) / cam.zoom + cam.x + W/2, y: (sy - H/2) / cam.zoom + cam.y + H/2 };
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  SFX.init();
  const x = e.clientX, y = e.clientY;

  if (state === 'menu') {
    for (const r of menuHits) {
      if (!inRect(r, x, y)) continue;
      menuAction(r.act);
      return;
    }
    return;                         // clicking empty menu space does nothing
  }
  if (state === 'over') { state = 'menu'; SFX.ui(); return; }
  if (paused) { paused = false; SFX.ui(); return; }

  if (stickHit(ui.stickL, x, y)) { ui.stickL.id = e.pointerId; ui.stickL.active = true; moveStick(ui.stickL, x, y); return; }
  if (stickHit(ui.stickR, x, y)) { ui.stickR.id = e.pointerId; ui.stickR.active = true; ui.mouseAim = false; moveStick(ui.stickR, x, y); return; }
  if (btnHit(ui.btnG, x, y)) { ui.btnG.id = e.pointerId; throwGrenade(me()); netPulse.nade = 1; return; }
  if (btnHit(ui.btnR, x, y)) { ui.btnR.id = e.pointerId; startReload(me()); netPulse.rel = 1; return; }
  if (btnHit(ui.btnM, x, y)) { ui.btnM.id = e.pointerId; meleeAttack(me()); netPulse.mel = 1; return; }
  if (btnHit(ui.btnP, x, y)) { if (NET.role !== 'guest') { paused = true; SFX.ui(); } return; }
  if (btnHit(ui.btnF, x, y)) { toggleFullscreen(); return; }
  ui.mouseAim = true; ui.mouseX = x; ui.mouseY = y; ui.mouseFire = true;
});

cv.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (e.pointerId === ui.stickL.id) { moveStick(ui.stickL, x, y); return; }
  if (e.pointerId === ui.stickR.id) { moveStick(ui.stickR, x, y); return; }
  ui.mouseX = x; ui.mouseY = y;
  if (e.pointerType === 'mouse') ui.mouseAim = true;
});

function endPointer(e) {
  if (e.pointerId === ui.stickL.id) { ui.stickL.id = null; ui.stickL.active = false; ui.stickL.kx = ui.stickL.ky = 0; }
  if (e.pointerId === ui.stickR.id) { ui.stickR.id = null; ui.stickR.active = false; ui.stickR.kx = ui.stickR.ky = 0; }
  if (e.pointerId === ui.btnG.id) ui.btnG.id = null;
  if (e.pointerId === ui.btnR.id) ui.btnR.id = null;
  if (e.pointerId === ui.btnM.id) ui.btnM.id = null;
  ui.mouseFire = false;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

function moveStick(s, x, y) {
  let dx = x - s.cx, dy = y - s.cy;
  const d = Math.hypot(dx, dy);
  if (d > s.r) { dx *= s.r/d; dy *= s.r/d; }
  s.kx = dx/s.r; s.ky = dy/s.r;
}

function menuAction(act) {
  SFX.ui();
  if (act === 'net-off')  { NET.disconnect(); return; }
  if (act === 'net-host') { NET.connect('host'); return; }
  if (act === 'net-join') { NET.connect('guest'); return; }
  if (act === 'mode-dm')  { mode = 'dm'; return; }
  if (act === 'mode-sv')  { mode = 'sv'; return; }
  if (act === 'start')    { startMatch(menuSel); return; }
  if (act && act.indexOf('lvl-') === 0) {
    const i = +act.slice(4);
    if (i < save.unlocked) menuSel = i;
    return;
  }
  if (act && act.indexOf('diff-') === 0) { diffKey = act.slice(5); persist(); return; }
  if (act === 'fs')    { toggleFullscreen(); return; }
  if (act === 'install' && installEvt) {
    installEvt.prompt();
    installEvt.userChoice.finally(() => { installEvt = null; });
    return;
  }
  if (act === 'music') { save.music = !save.music; persist(); SFX.music(save.music); return; }
  if (act === 'name') {
    let n = null;
    try { n = window.prompt('Pilot name (up to 10 letters)', save.profile.name); } catch (e) {}
    if (n === null) return;
    save.profile.name = cleanName(n);
    profileChanged();
    return;
  }
  if (act && act.indexOf('col-') === 0) {
    save.profile.color = PALETTE[+act.slice(4)] || save.profile.color;
    profileChanged();
    return;
  }
}

// push a new name/colour everywhere it is shown
function profileChanged() {
  persist();
  if (players[0] && NET.role !== 'guest') {
    players[0].name = save.profile.name;
    players[0].color = save.profile.color;
    recolorBots();
    NET.sendLobby();
  }
  // a waiting guest re-announces itself so the host's lobby updates
  if (NET.role === 'guest' && state !== 'play') NET.connect('guest');
}

// ---- installable app ----------------------------------------------------
// Service workers only run on secure origins, which includes localhost but NOT
// a plain http://192.168.x.x LAN address — so the host machine can install the
// app, while friends on the hotspot play in the browser (fullscreen still works).
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { installEvt = null; });
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (!isFullscreen()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      const r = req.call(el, { navigationUI: 'hide' });
      // phones: once fullscreen, pin to landscape where the browser allows it
      const lock = () => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
      if (r && r.then) r.then(lock).catch(() => {}); else lock();
    } else {
      const ex = d.exitFullscreen || d.webkitExitFullscreen;
      if (ex) ex.call(d);
    }
  } catch (e) {}
}

function startMatch(idx) {
  if (NET.role === 'guest') return;      // guests drop in when the host starts
  levelIndex = Math.min(idx, save.unlocked - 1);
  state = 'play'; paused = false;
  resetMatch(); layoutControls(); SFX.ui();
}

window.addEventListener('keydown', e => {
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  SFX.init();
  if (e.code === 'KeyM') SFX.toggleMute();
  if (e.code === 'KeyN') { save.music = !save.music; persist(); SFX.music(save.music); }

  if (state === 'menu') {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { menuSel = Math.min(save.unlocked - 1, menuSel + 1); SFX.ui(); }
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') { menuSel = Math.max(0, menuSel - 1); SFX.ui(); }
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'KeyW') {
      mode = mode === 'dm' ? 'sv' : 'dm'; SFX.ui();
    }
    if (e.code === 'Space' || e.code === 'Enter') startMatch(menuSel);
    const pick = { Digit1:'easy', Digit2:'normal', Digit3:'hard' }[e.code];
    if (pick) { diffKey = pick; persist(); SFX.ui(); }
  } else if (state === 'over') {
    if (e.code === 'Space' || e.code === 'Enter') { state = 'menu'; SFX.ui(); }
  } else if (state === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') { paused = !paused; SFX.ui(); }
    if (paused && e.code === 'Enter') { paused = false; resetMatch(); }
    if (!paused && e.code === 'KeyG') { throwGrenade(me()); netPulse.nade = 1; }
    if (!paused && e.code === 'KeyR') { startReload(me()); netPulse.rel = 1; }
    if (!paused && e.code === 'KeyF') { meleeAttack(me()); netPulse.mel = 1; }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ==================================================================
// PHYSICS
// ==================================================================
const rectHit = (ax, ay, aw, ah, b) => ax < b.x + b.w && ax + aw > b.x && ay < b.y + b.h && ay + ah > b.y;

function movePlayer(pl, dt) {
  pl.x += pl.vx * dt;
  for (const s of platforms) {
    if (!rectHit(pl.x - PW/2, pl.y - PH/2, PW, PH, s)) continue;
    if (pl.vx > 0) pl.x = s.x - PW/2; else if (pl.vx < 0) pl.x = s.x + s.w + PW/2;
    pl.vx = 0;
  }
  pl.y += pl.vy * dt;
  pl.onGround = false; pl.standPlat = null;
  for (const s of platforms) {
    if (!rectHit(pl.x - PW/2, pl.y - PH/2, PW, PH, s)) continue;
    if (pl.vy > 0) { pl.y = s.y - PH/2; pl.onGround = true; pl.standPlat = s; }
    else if (pl.vy < 0) pl.y = s.y + s.h + PH/2;
    pl.vy = 0;
  }
  pl.x = Math.max(PW/2, Math.min(WORLD.w - PW/2, pl.x));
}

function lineClear(x1, y1, x2, y2) {
  const steps = Math.max(2, Math.hypot(x2-x1, y2-y1) / 22) | 0;
  for (let i = 1; i < steps; i++) {
    const t = i/steps, x = x1 + (x2-x1)*t, y = y1 + (y2-y1)*t;
    for (const s of platforms) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return false;
  }
  return true;
}

// ==================================================================
// COMBAT
// ==================================================================
function startReload(pl) {
  const w = WEAPONS[pl.weapon];
  if (pl.reloading > 0 || pl.ammo >= w.mag || pl.dead) return;
  pl.reloading = w.reload;
}

function fire(pl) {
  if (NET.role === 'guest') return;   // host owns the simulation
  const w = WEAPONS[pl.weapon];
  if (pl.dead || pl.cool > 0 || pl.reloading > 0) return;
  if (pl.ammo <= 0) { startReload(pl); return; }
  pl.cool = w.rate; pl.ammo--;
  pl.anim.recoil = 1;

  const mx = pl.x + Math.cos(pl.aim) * 26, my = pl.y + Math.sin(pl.aim) * 26 - 2;
  const dmgMul = pl.buffs.damage > 0 ? 2 : 1;

  // --- railgun: instant piercing beam, stopped only by geometry ---
  if (w.hitscan) {
    if (pl === me()) stats.shots++;
    const ca = Math.cos(pl.aim), sa = Math.sin(pl.aim);
    const struck = new Set();
    let ex = mx, ey = my;
    for (let t = 0; t < 2400; t += 8) {
      ex = mx + ca*t; ey = my + sa*t;
      let blocked = false;
      for (const pf of platforms) {
        if (ex > pf.x && ex < pf.x + pf.w && ey > pf.y && ey < pf.y + pf.h) { blocked = true; break; }
      }
      if (blocked) break;
      for (const q of players) {
        if (q.dead || q.i === pl.i || q.guard > 0 || struck.has(q)) continue;
        if (Math.abs(q.x - ex) < PW/2 + 4 && Math.abs(q.y - ey) < PH/2 + 4) {
          struck.add(q);
          if (pl === me()) stats.hits++;
          damage(q, w.dmg*dmgMul, pl.i);
          q.vx += ca*260; q.vy += sa*160;
          spark(q.x, q.y, 10, '#a78bfa', 320);
        }
      }
    }
    beams.push({ x1:mx, y1:my, x2:ex, y2:ey, life:1, color: dmgMul > 1 ? '#ff6b81' : '#a78bfa' });
    NET.fx({ k:'beam', x:mx, y:my, x2:ex, y2:ey, c: dmgMul > 1 ? '#ff6b81' : '#a78bfa' });
    spark(ex, ey, 12, '#a78bfa', 280);
    pl.vx -= ca * w.kick * 0.35; pl.vy -= sa * w.kick * 0.18;
    SFX.shot('sniper', pl === me() ? 1 : volAt(pl.x, pl.y)*0.75);
    if (pl === me()) { shake = Math.min(18, shake + 9); cam.tzoom = Math.min(cam.tzoom, 0.97); }
    if (pl.ammo === 0) startReload(pl);
    return;
  }

  if (pl === me()) stats.shots += w.pellets;
  for (let i = 0; i < w.pellets; i++) {
    const a = pl.aim + (Math.random() - 0.5) * w.spread * 2;
    bullets.push({
      x:mx, y:my, vx:Math.cos(a)*w.speed, vy:Math.sin(a)*w.speed,
      dmg:w.dmg*dmgMul, owner:pl.i, life:1.7, rocket:!!w.rocket,
      color: pl.buffs.damage > 0 ? '#ff6b81' : pl.color, smoke:0
    });
  }
  // muzzle smoke + ejected casing
  for (let i = 0; i < 4; i++) {
    const a = pl.aim + (Math.random()-0.5)*0.8;
    parts.push({ x:mx, y:my, vx:Math.cos(a)*180, vy:Math.sin(a)*180 - 40, life:0.25, color:'#fff3c4', size:3 });
  }
  casings.push({
    x: pl.x - Math.cos(pl.aim)*6, y: pl.y - 4,
    vx: -Math.cos(pl.aim)*120 + (Math.random()-0.5)*80, vy: -220 - Math.random()*90,
    rot: Math.random()*6, vr: 12 + Math.random()*10, life: 1.4
  });

  pl.vx -= Math.cos(pl.aim) * w.kick * 0.35;
  pl.vy -= Math.sin(pl.aim) * w.kick * 0.18;
  SFX.shot(pl.weapon, pl === me() ? 1 : volAt(pl.x, pl.y) * 0.75);
  NET.fx({ k:'shot', x:pl.x, y:pl.y, a:pl.aim, w:pl.weapon, i:pl.i });
  if (pl === me()) {
    shake = Math.min(16, shake + (w.rocket ? 10 : 3));
    cam.tzoom = Math.min(cam.tzoom, 0.985);           // tiny punch out
  }
}

// close-range strike: big damage, bigger shove, no ammo
function meleeAttack(pl) {
  if (NET.role === 'guest') return;   // host owns the simulation
  if (pl.dead || pl.mcool > 0 || paused) return;
  pl.mcool = MELEE_CD;
  pl.anim.melee = 1;
  const ca = Math.cos(pl.aim), sa = Math.sin(pl.aim);
  const hx = pl.x + ca*34, hy = pl.y + sa*34;
  let connected = false;
  for (const q of players) {
    if (q.dead || q.i === pl.i || q.guard > 0) continue;
    if (Math.hypot(q.x - hx, q.y - hy) > MELEE_RANGE) continue;
    connected = true;
    if (pl === me()) { stats.hits++; stats.shots++; }
    damage(q, MELEE_DMG, pl.i);
    q.vx += ca*820; q.vy += sa*420 - 240;
    spark(q.x, q.y, 14, '#fff', 380);
  }
  if (pl === me()) {
    shake = Math.min(16, shake + (connected ? 9 : 3));
    SFX[connected ? 'zap' : 'ui']();
  }
  for (let i = 0; i < 6; i++) {
    const a = pl.aim + (Math.random()-0.5)*1.2;
    parts.push({ x:hx, y:hy, vx:Math.cos(a)*260, vy:Math.sin(a)*260, life:0.2, color:'#eaf6ff', size:3 });
  }
}

function throwGrenade(pl) {
  if (NET.role === 'guest') return;   // host owns the simulation
  if (pl.dead || pl.grenades <= 0 || pl.gcool > 0 || paused) return;
  pl.grenades--; pl.gcool = 0.5;
  grenades.push({
    x: pl.x + Math.cos(pl.aim)*24, y: pl.y + Math.sin(pl.aim)*24,
    vx: pl.vx*0.4 + Math.cos(pl.aim)*820, vy: pl.vy*0.4 + Math.sin(pl.aim)*820,
    t: 1.9, owner: pl.i, rot: 0
  });
}

// everything you *see* when something blows up — shared by the host
// simulation and by LAN guests replaying the host's effects
function boomVisual(x, y, r) {
  waves.push({ x, y, r: 10, max: r * 1.25, life: 1 });
  fireballs.push({ x, y, r, t: 0, life: 0.85 });
  decal(x, y, r * 0.30);
  for (let i = 0; i < 26; i++) {                          // hot sparks
    const a = Math.random()*Math.PI*2, s = 60 + Math.random()*520;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.35+Math.random()*0.5,
                 color: i % 3 ? '#ffb347' : '#fff', size: 3 + Math.random()*4 });
  }
  for (let i = 0; i < 10; i++) {                          // tumbling debris
    const a = -Math.PI/2 + (Math.random() - 0.5)*2.6, s = 220 + Math.random()*420;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.9+Math.random()*0.7,
                 color: Math.random() < 0.35 ? '#ff9a4a' : '#2a2f3d', size: 3 + Math.random()*4,
                 chunk:true, rot: Math.random()*6, vr: (Math.random() - 0.5)*18 });
  }
  for (let i = 0; i < 14; i++) {                          // rolling smoke column
    const a = Math.random()*Math.PI*2, s = Math.random()*140;
    parts.push({ x: x + (Math.random() - 0.5)*r*0.3, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 70,
                 life: 0.9 + Math.random()*0.8,
                 color: i < 5 ? 'rgba(40,36,44,0.55)' : 'rgba(110,108,124,0.45)',
                 size: 8 + Math.random()*12, smoke:true });
  }
  const dme = players.length ? Math.hypot(me().x - x, me().y - y) : 9999;
  if (dme < 520) flashWhite = Math.max(flashWhite, 0.28*(1 - dme/520));
}

function explode(x, y, r, dmg, owner) {
  boomVisual(x, y, r);
  SFX.boom(Math.max(0.15, volAt(x, y)));
  NET.fx({ k:'boom', x, y, r });

  for (const q of players) {
    if (q.dead || q.guard > 0) continue;
    const d = Math.hypot(q.x - x, q.y - y);
    if (d > r) continue;
    const f = 1 - d/r;
    damage(q, dmg * f, owner);
    const a = Math.atan2(q.y - y, q.x - x);
    q.vx += Math.cos(a)*900*f; q.vy += Math.sin(a)*900*f - 120*f;
  }
  const dme = Math.hypot(me().x - x, me().y - y);
  if (dme < 700) { shake = Math.min(28, shake + 22*(1 - dme/700)); cam.tzoom = 1.04; }
}

function damage(pl, amount, owner) {
  if (pl.dead || pl.guard > 0) return;
  if (pl.shield > 0) {                     // shield soaks first
    const soak = Math.min(pl.shield, amount);
    pl.shield -= soak; amount -= soak;
    spark(pl.x, pl.y, 5, '#6ee7ff', 220);
    if (amount <= 0) { if (owner === 0 && pl !== me()) { hitMark = 0.16; SFX.hit(0.7); } return; }
  }
  pl.hp -= amount;
  pl.anim.flash = 1;
  spark(pl.x, pl.y, 4, pl.color, 180);
  if (owner === 0 && pl !== me()) {
    floater(pl.x, pl.y - 26, String(Math.round(amount)), '#ffd166');
    hitMark = 0.16; SFX.hit(1);
    stats.dmg += amount;
  }
  if (pl === me()) {
    hurtFlash = Math.min(1, hurtFlash + amount/55);
    shake = Math.min(18, shake + amount*0.14);
    SFX.hurt();
    // mark which way the damage came from — in a five-way fight you otherwise
    // have no idea who is shooting you
    const from = players[owner];
    if (from && from !== pl) {
      dmgArrows.push({ a: Math.atan2(from.y - pl.y, from.x - pl.x), t: 1.2, c: from.color });
      if (dmgArrows.length > 6) dmgArrows.shift();
    }
  }
  if (pl.hp <= 0) kill(pl, owner);
}

function kill(pl, ownerIdx) {
  pl.dead = true; pl.respawn = RESPAWN_T; pl.deaths++; pl.hp = 0; pl.shield = 0;
  pl.buffs = { damage:0, speed:0, fuel:0 };
  SFX.die(pl === me() ? 1 : volAt(pl.x, pl.y));
  NET.fx({ k:'die', x:pl.x, y:pl.y, c:pl.color });

  // ragdoll corpse + gibs
  corpses.push({ x:pl.x, y:pl.y, vx:pl.vx*0.4 + (Math.random()-0.5)*160, vy:-260 - Math.random()*140,
                 rot:0, vr:(Math.random()-0.5)*14, color:pl.color, life:3.2 });
  for (let i = 0; i < 14; i++) {
    const a = Math.random()*Math.PI*2, s = 90 + Math.random()*320;
    parts.push({ x:pl.x, y:pl.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 80,
                 life:0.5+Math.random()*0.6, color:pl.color, size:3+Math.random()*3 });
  }
  if (pl === me()) {
    streak.n = 0; streak.t = 0; flashWhite = 0.5;
    const k = players[ownerIdx];
    deathCam = (k && k !== pl) ? { p: k, t: RESPAWN_T + 0.4 } : null;   // watch your killer
  }
  if (mode === 'sv' && pl.isBot) pl.gone = true;          // survival enemies stay down

  const killer = players[ownerIdx];
  if (killer && killer !== pl) {
    killer.kills++;
    feed.unshift({ t:4, a:killer.name, ac:killer.color, b:pl.name, bc:pl.color });
    if (killer === me()) {
      streak.n++;
      const names = { 2:'DOUBLE KILL', 3:'TRIPLE KILL', 4:'RAMPAGE', 5:'UNSTOPPABLE', 7:'GODLIKE' };
      stats.bestStreak = Math.max(stats.bestStreak, streak.n);
      if (names[streak.n]) { streak.text = names[streak.n]; streak.t = 2.2; SFX.power(); }
      if (streak.n === 3) airdrop(me().x, 'rocket');      // streak reward
      if (streak.n === 6) airdrop(me().x, 'minigun');
      floater(pl.x, pl.y - 44, '+1', '#9dffb0', true);
    }
  } else {
    feed.unshift({ t:4, a:'', ac:'#888', b: pl.name + ' self-destructed', bc: pl.color });
  }
  feed = feed.slice(0, 5);

  if (mode === 'sv') {
    if (pl === me()) {
      sv.lives--;
      if (sv.lives <= 0 && !pendingOver) {
        sv.over = true; pendingOver = 'sv';
        timeScale = 0.28; slowT = 1.4; cam.tzoom = 1.45;
      }
    }
    return;
  }

  if (killer && killer.kills >= level.target && !pendingOver) {
    pendingOver = killer;
    timeScale = 0.22; slowT = 1.5;                       // slow-mo finish
    cam.tzoom = 1.5;
  }
}

// ------------------------------ survival ------------------------------
function startWave(n) {
  sv.wave = n;
  const count = Math.min(6, 2 + Math.floor(n/2));
  const hpMul = 1 + (n - 1) * 0.10;
  const you = me();
  for (let k = 0; k < count; k++) {
    const idx = players.length;
    const b = makePlayer(idx, true);
    // never reuse slot 0's name/colour — that belongs to the human
    b.name  = botName(idx);
    b.color = botColor(idx);
    // spawn away from the player so waves don't materialize on top of you
    let bestS = spawns[0], bestD = -1;
    for (const s of spawns) {
      const d = Math.hypot(s[0] - you.x, s[1] - you.y) * (0.6 + Math.random()*0.8);
      if (d > bestD) { bestD = d; bestS = s; }
    }
    b.x = bestS[0]; b.y = bestS[1];
    b.hpMax = 100 * hpMul; b.hp = b.hpMax;
    b.skill = Math.min(1, (n - 1) / 9);
    b.guard = 0.8;
    if (n >= 4 && k === 0) { b.weapon = 'shotgun'; b.ammo = WEAPONS.shotgun.mag; }
    if (n >= 7 && k === 1) { b.weapon = 'smg';     b.ammo = WEAPONS.smg.mag; }
    players.push(b);
    spark(b.x, b.y, 18, b.color, 360);
  }
  feed.unshift({ t:3, a:'', ac:'#888', b:'WAVE ' + n + '  ·  ' + count + ' HOSTILES', bc:'#ffd166' });
  SFX.power();
}

function updateSurvival(dt) {
  if (sv.over) return;
  const alive = players.filter(q => q.isBot && !q.gone).length;
  if (sv.breather > 0) {
    sv.breather -= dt;
    if (sv.breather <= 0) startWave(sv.wave + 1);
    return;
  }
  if (alive === 0) {
    sv.breather = 3.0;
    const you = me();
    you.hp = Math.min(you.hpMax, you.hp + 35);
    you.grenades = Math.min(4, you.grenades + 2);
    for (const pk of pickups) { pk.ready = true; pk.respawn = 0; }
    feed.unshift({ t:3, a:'', ac:'#888', b:'WAVE ' + sv.wave + ' CLEARED  ·  +35 HP', bc:'#9dffb0' });
    floater(you.x, you.y - 40, 'WAVE CLEAR', '#9dffb0', true);
    SFX.win();
    const bw = save.bestWave[levelIndex] || 0;
    if (sv.wave > bw) { save.bestWave[levelIndex] = sv.wave; persist(); }
  }
}

function airdrop(x, gun) {
  drops.push({ x, y: cam.y - 40, gun, vy: 0, t: 0 });
  feed.unshift({ t:3.2, a:'', ac:'#888', b:'AIRDROP INBOUND', bc:'#ffd166' });
  SFX.power();
}

function spark(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, s = Math.random()*spd;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.35+Math.random()*0.5, color, size:3 });
  }
}

// ==================================================================
// BOT BRAIN
// ==================================================================
function botThink(pl, dt) {
  const b = pl.bt, base = DIFF();
  // survival waves sharpen the enemies beyond the chosen difficulty
  const k = pl.skill || 0;
  const D = k <= 0 ? base : {
    aimErr: base.aimErr * (1 - 0.55*k),
    react: [base.react[0]*(1 - 0.5*k), base.react[1]*(1 - 0.5*k)],
    turn: base.turn * (1 + 0.6*k),
    range: base.range * (1 + 0.25*k),
    fireArc: base.fireArc,
    accelMul: Math.min(1.15, base.accelMul * (1 + 0.3*k))
  };
  b.think -= dt;
  if (b.think <= 0) {
    b.think = 0.22;
    let bestT = null, bestScore = 1e9;
    if (mode === 'sv') {
      bestT = me().dead ? null : me();          // survival: the horde only wants you
    } else {
      for (const q of players) {
        if (q === pl || q.dead) continue;
        const d = Math.hypot(q.x - pl.x, q.y - pl.y);
        const sc = d * (lineClear(pl.x, pl.y, q.x, q.y) ? 1 : 2.6);
        if (sc < bestScore) { bestScore = sc; bestT = q; }
      }
    }
    b.target = bestT;
    b.strafe = Math.random() < 0.5 ? -1 : 1;
    b.roam = Math.random();
  }

  const t = b.target;
  if (!t || t.dead) { pl.vx *= 0.9; return; }

  const dx = t.x - pl.x, dy = t.y - pl.y;
  const dist = Math.hypot(dx, dy);
  const vis = lineClear(pl.x, pl.y, t.x, t.y);
  const w = WEAPONS[pl.weapon];

  const travel = Math.min(0.5, dist / w.speed);
  const px = t.x + t.vx*travel, py = t.y + t.vy*travel;
  const want = Math.atan2(py - pl.y, px - pl.x) + (Math.random()-0.5)*D.aimErr;
  let da = want - pl.aim;
  while (da > Math.PI) da -= Math.PI*2;
  while (da < -Math.PI) da += Math.PI*2;
  pl.aim += da * Math.min(1, dt * D.turn);
  pl.face = Math.cos(pl.aim) >= 0 ? 1 : -1;

  b.react -= dt;
  const idealMin = pl.weapon === 'shotgun' ? 60 : 180;
  const idealMax = (pl.weapon === 'sniper' ? 1300 : pl.weapon === 'shotgun' ? 340 : 760) * D.range;
  if (vis && dist < idealMax*1.4 && Math.abs(da) < D.fireArc) {
    if (b.react <= 0) { fire(pl); b.react = w.auto ? 0 : D.react[0] + Math.random()*(D.react[1]-D.react[0]); }
  }
  if (pl.ammo <= 0) startReload(pl);
  if (dist < MELEE_RANGE + 20 && pl.mcool <= 0 && Math.random() < dt*3) meleeAttack(pl);

  let mx = 0;
  if (dist > idealMax) mx = Math.sign(dx);
  else if (dist < idealMin) mx = -Math.sign(dx);
  else mx = b.strafe * (b.roam < 0.7 ? 1 : 0);

  const accel = (pl.onGround ? MOVE_ACCEL : AIR_ACCEL) * D.accelMul;
  pl.vx += mx * accel * dt;

  // stay airborne over hazards and the void
  let overDanger = pl.y > WORLD.h - 240;
  for (const lv of level.lava) if (pl.x > lv.x - 60 && pl.x < lv.x + lv.w + 60 && pl.y > lv.y - 220) overDanger = true;
  const dodging = vis && dist < 520 && b.roam > 0.55;
  pl.jetting = (dy < -70 || overDanger || dodging) && pl.fuel > 12;
  if (pl.jetting) pl.vy -= JET_THRUST * dt;
  if (pl.onGround && (dy < -40 || b.roam > 0.85)) pl.vy = -JUMP_V;
  if (!vis && dist < 520 && pl.grenades > 0 && Math.random() < dt*0.6) throwGrenade(pl);

  // bots contest the map too: they'll detour much further for a power weapon
  // or shield/damage than for a basic crate, so holding those spots is a fight
  const holdingPower = (WEAPON_TIER[pl.weapon] || 0) === 3;
  for (const pk of pickups) {
    if (!pk.ready) continue;
    const prize = (pk.kind === 'gun' && pk.tier === 3 && !holdingPower) ||
                  (pk.kind === 'power' && (pk.power === 'shield' || pk.power === 'damage'));
    const reach = prize ? 480 : 210;
    if (pk.kind === 'gun' && pk.tier < 3 && holdingPower) continue;   // don't downgrade
    if (Math.hypot(pk.x - pl.x, pk.y - pl.y) < reach && (pk.kind !== 'med' || pl.hp < 60)) {
      pl.vx += Math.sign(pk.x - pl.x) * accel * dt * (prize ? 0.8 : 0.5);
      if (pk.y < pl.y - 40 && pl.fuel > 25) { pl.jetting = true; pl.vy -= JET_THRUST*dt; }
    }
  }
}

// ==================================================================
// UPDATE
// ==================================================================
function humanControl(pl, dt) {
  if (ui.stickR.active && Math.hypot(ui.stickR.kx, ui.stickR.ky) > 0.25) {
    pl.aim = Math.atan2(ui.stickR.ky, ui.stickR.kx);
  } else if (ui.mouseAim) {
    const wpt = toWorld(ui.mouseX, ui.mouseY);
    pl.aim = Math.atan2(wpt.y - pl.y, wpt.x - pl.x);
  }
  pl.face = Math.cos(pl.aim) >= 0 ? 1 : -1;

  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft)  mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (ui.stickL.active) { mx += ui.stickL.kx; my += ui.stickL.ky; }
  mx = Math.max(-1, Math.min(1, mx));

  const spd = pl.buffs.speed > 0 ? 1.45 : 1;
  const accel = (pl.onGround ? MOVE_ACCEL : AIR_ACCEL) * spd;
  pl.vx += mx * accel * dt;
  const cap = MAX_RUN * spd;
  if (Math.abs(pl.vx) > cap && Math.sign(pl.vx) === Math.sign(mx)) pl.vx = cap * Math.sign(pl.vx);

  const wantUp = keys.KeyW || keys.Space || keys.ArrowUp || (ui.stickL.active && my < -0.35);
  if (wantUp && pl.onGround) { pl.vy = -JUMP_V; pl.jetting = false; }
  else if (wantUp && pl.fuel > 0) { pl.vy -= JET_THRUST*dt; pl.jetting = true; }
  else pl.jetting = false;

  const w = WEAPONS[pl.weapon];
  const stickFiring = ui.stickR.active && Math.hypot(ui.stickR.kx, ui.stickR.ky) > 0.55;
  const firing = ui.mouseFire || stickFiring || keys.KeyJ;
  if (firing && (w.auto || pl.cool <= 0)) {
    if (w.auto) fire(pl);
    else if (!pl._held) { fire(pl); pl._held = true; }
  }
  if (!firing) pl._held = false;
}

// animation + trail particles; shared by the host sim and guest rendering
function animate(pl, dt, wasAir, fallV) {
  const an = pl.anim;
  if (!an) return;
  an.walk += Math.abs(pl.vx) * dt * 0.05;
  const leanT = Math.max(-0.32, Math.min(0.32, pl.vx / 900));
  an.lean += (leanT - an.lean) * Math.min(1, dt*10);
  an.recoil = Math.max(0, an.recoil - dt*5);
  an.melee  = Math.max(0, an.melee - dt*4);
  an.flash  = Math.max(0, an.flash - dt*6);
  an.squash = Math.max(0, an.squash - dt*4);
  if (wasAir && pl.onGround && fallV > 620) {           // landing impact
    an.squash = Math.min(1, fallV/1400);
    for (let i = 0; i < 7; i++) {
      parts.push({ x: pl.x + (Math.random()-0.5)*20, y: pl.y + PH/2,
                   vx:(Math.random()-0.5)*220, vy:-Math.random()*90,
                   life:0.35, color:'rgba(200,215,240,0.5)', size:4 });
    }
    if (pl === me() && fallV > 1000) shake = Math.min(12, shake + 5);
  }
  if (pl.onGround && Math.abs(pl.vx) > 180 && Math.random() < dt*22) {
    parts.push({ x: pl.x, y: pl.y + PH/2, vx:-pl.vx*0.15, vy:-40 - Math.random()*50,
                 life:0.3, color:'rgba(190,205,230,0.35)', size:3 });
  }
  if (pl.jetting && pl.fuel > 0) {
    const big = pl.buffs && pl.buffs.fuel > 0;
    for (let i = 0; i < (big ? 2 : 1); i++) {
      parts.push({ x: pl.x - pl.face*4 + (Math.random()-0.5)*6, y: pl.y + 14,
                   vx:(Math.random()-0.5)*90 - pl.vx*0.1, vy: 240 + Math.random()*200,
                   life:0.22, color: Math.random() < 0.5 ? '#ffb347' : (big ? '#ffd166' : '#6ee7ff'), size:4 });
    }
  }
}

// a networked player driven by the input packets their browser sends us
function remoteControl(pl, dt) {
  const inp = NET.inputs[pl.netId];
  if (!inp) { pl.vx *= 0.92; return; }
  pl.aim = inp.aim || 0;
  pl.face = Math.cos(pl.aim) >= 0 ? 1 : -1;

  const spd = pl.buffs.speed > 0 ? 1.45 : 1;
  const accel = (pl.onGround ? MOVE_ACCEL : AIR_ACCEL) * spd;
  pl.vx += (inp.mx || 0) * accel * dt;
  const cap = MAX_RUN * spd;
  if (Math.abs(pl.vx) > cap && Math.sign(pl.vx) === Math.sign(inp.mx)) pl.vx = cap * Math.sign(pl.vx);

  if (inp.up && pl.onGround) { pl.vy = -JUMP_V; pl.jetting = false; }
  else if (inp.up && pl.fuel > 0) { pl.vy -= JET_THRUST*dt; pl.jetting = true; }
  else pl.jetting = false;

  const w = WEAPONS[pl.weapon];
  if (inp.fire && (w.auto || pl.cool <= 0)) {
    if (w.auto) fire(pl);
    else if (!pl._rheld) { fire(pl); pl._rheld = true; }
  }
  if (!inp.fire) pl._rheld = false;
  if (inp.nade) { throwGrenade(pl); inp.nade = 0; }
  if (inp.rel)  { startReload(pl);  inp.rel = 0; }
  if (inp.mel)  { meleeAttack(pl);  inp.mel = 0; }
}

function updatePlayer(pl, dt) {
  if (pl.dead) {
    if (pl.gone) return;                       // survival enemies never come back
    if (mode === 'sv' && pl === me() && sv.lives <= 0) return;
    pl.respawn -= dt;
    if (pl.respawn <= 0) {
      const s = spawns[(Math.random()*spawns.length)|0];
      pl.x = s[0]; pl.y = s[1]; pl.vx = pl.vy = 0;
      pl.hp = pl.hpMax; pl.fuel = 100; pl.dead = false; pl.guard = SPAWN_GUARD;
      pl.weapon = 'pistol'; pl.ammo = WEAPONS.pistol.mag; pl.reloading = 0; pl.grenades = 3;
      pl.anim.flash = 0;
      spark(pl.x, pl.y, 16, pl.color, 300);
    }
    return;
  }

  pl.guard = Math.max(0, pl.guard - dt);
  pl.cool = Math.max(0, pl.cool - dt);
  pl.gcool = Math.max(0, pl.gcool - dt);
  pl.mcool = Math.max(0, pl.mcool - dt);
  pl.portalCool = Math.max(0, pl.portalCool - dt);
  for (const k in pl.buffs) pl.buffs[k] = Math.max(0, pl.buffs[k] - dt);

  if (pl.reloading > 0) {
    pl.reloading -= dt;
    if (pl.reloading <= 0) { pl.ammo = WEAPONS[pl.weapon].mag; pl.reloading = 0; }
  }

  if (pl.isBot) botThink(pl, dt);
  else if (pl.isRemote) remoteControl(pl, dt);
  else humanControl(pl, dt);

  if (pl.jetting && pl.fuel > 0) {
    if (pl.buffs.fuel <= 0) pl.fuel = Math.max(0, pl.fuel - JET_DRAIN*dt);
  } else {
    pl.fuel = Math.min(100, pl.fuel + JET_REGEN*(pl.onGround ? 1.6 : 1)*dt);
  }

  pl.vy += GRAV() * dt;
  if (pl.onGround && Math.abs(pl.vx) > 1) pl.vx *= Math.pow(FRICTION, dt*60);
  pl.vx = Math.max(-MAX_RUN*2.2, Math.min(MAX_RUN*2.2, pl.vx));
  pl.vy = Math.min(MAX_FALL, pl.vy);

  const wasAir = !pl.onGround, fallV = pl.vy;
  movePlayer(pl, dt);

  animate(pl, dt, wasAir, fallV);

  // --- hazards ---
  for (const lv of level.lava) {
    if (rectHit(pl.x - PW/2, pl.y - PH/2, PW, PH, lv)) {
      damage(pl, 130*dt, pl.i);
      pl.vy = Math.min(pl.vy, -300);
      if (Math.random() < dt*30) parts.push({ x:pl.x+(Math.random()-0.5)*20, y:lv.y,
        vx:(Math.random()-0.5)*120, vy:-180-Math.random()*160, life:0.5, color:'#ffb347', size:4 });
    }
  }
  if (level.killFloor && pl.y > WORLD.h + 120) { pl.hp = 0; kill(pl, pl.i); return; }

  // --- portals ---
  for (const pt of level.portals) {
    if (pl.portalCool > 0) break;
    if (rectHit(pl.x - PW/2, pl.y - PH/2, PW, PH, pt)) {
      spark(pl.x, pl.y, 14, '#a78bfa', 320);
      pl.x = pt.tx; pl.y = pt.ty; pl.portalCool = 0.9;
      spark(pl.x, pl.y, 14, '#a78bfa', 320);
      if (pl === me()) SFX.zap();
      break;
    }
  }

  // --- pickups ---
  for (const pk of pickups) {
    if (!pk.ready) continue;
    if (Math.abs(pk.x - pl.x) > 30 || Math.abs(pk.y - pl.y) > 34) continue;
    if (pk.kind === 'gun') {
      // don't burn a spawn you can't use: same gun, full mag -> leave it there
      if (pl.weapon === pk.gun && pl.ammo >= WEAPONS[pk.gun].mag && pl.reloading <= 0) continue;
      // brushing past a basic crate must never cost you a better gun
      if ((WEAPON_TIER[pk.gun] || 1) < (WEAPON_TIER[pl.weapon] || 0)) continue;
      pl.weapon = pk.gun; pl.ammo = WEAPONS[pk.gun].mag; pl.reloading = 0;
      if (pl === me()) floater(pk.x, pk.y - 20, WEAPONS[pk.gun].name, pk.tier === 3 ? '#ffd166' : '#6ee7ff', pk.tier === 3);
      if (pk.tier === 3 && !pk.temp) {
        // (an 'a' name would render as "X fragged Y", so this goes in 'b')
        feed.unshift({ t:3, a:'', ac:'#888', b: pl.name + ' took the ' + WEAPONS[pk.gun].name, bc: pl.color });
      }
    } else if (pk.kind === 'med') {
      if (pl.hp >= pl.hpMax) continue;
      pl.hp = Math.min(pl.hpMax, pl.hp + 45);
      if (pl === me()) floater(pk.x, pk.y - 20, '+45 HP', '#9dffb0');
    } else {
      const P = POWERS[pk.power];
      if (pk.power === 'shield') pl.shield = P.amount; else pl.buffs[pk.power] = P.dur;
      if (pl === me()) { floater(pk.x, pk.y - 20, P.name, P.color, true); SFX.power(); }
    }
    pk.ready = false;
    pk.respawn = pk.every || 12;
    spark(pk.x, pk.y, 12, '#9dffb0', 260);
    if (pl === me() && pk.kind !== 'power') SFX.pick();
  }
}

function updateMovers(dt) {
  for (const m of level.movers) {
    m.t += dt * m.speed;
    const k = (Math.sin(m.t * Math.PI * 2) + 1) / 2;
    const nx = m.ax + (m.bx - m.ax) * k, ny = m.ay + (m.by - m.ay) * k;
    m.dx = nx - m.x; m.dy = ny - m.y;
    m.x = nx; m.y = ny;
  }
  // carry whoever is standing on one
  for (const pl of players) {
    if (pl.dead || !pl.onGround || !pl.standPlat) continue;
    const m = pl.standPlat;
    if (m.dx === undefined) continue;
    pl.x += m.dx; pl.y += m.dy;
  }
}

function updateBullets(dt) {
  for (const b of bullets) {
    b.life -= dt;
    if (b.rocket) {
      b.vy += 260*dt;
      b.smoke -= dt;
      if (b.smoke <= 0) {
        b.smoke = 0.015;
        parts.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40 - 20,
                     life:0.6, color:'rgba(150,150,165,0.45)', size:5+Math.random()*4, smoke:true });
      }
    }
    const steps = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy)*dt/10));
    const sdt = dt/steps;
    for (let s = 0; s < steps && b.life > 0; s++) {
      b.x += b.vx*sdt; b.y += b.vy*sdt;
      for (const pf of platforms) {
        if (b.x > pf.x && b.x < pf.x + pf.w && b.y > pf.y && b.y < pf.y + pf.h) {
          if (b.rocket) { explode(b.x, b.y, 135, 60, b.owner); decal(b.x, b.y, 26); }
          else {
            spark(b.x, b.y, 4, '#b9c7e6', 200);
            decal(b.x, b.y, 5 + Math.random()*4);
            for (let i = 0; i < 2; i++) parts.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*160,
              vy:-Math.random()*120, life:0.25, color:'#fff3c4', size:2 });
          }
          b.life = 0; break;
        }
      }
      if (b.life <= 0) break;
      for (const q of players) {
        if (q.dead || q.i === b.owner || q.guard > 0) continue;
        if (Math.abs(q.x - b.x) < PW/2 + 3 && Math.abs(q.y - b.y) < PH/2 + 3) {
          if (b.rocket) explode(b.x, b.y, 135, 60, b.owner);
          else { damage(q, b.dmg, b.owner); q.vx += Math.sign(b.vx)*70; }
          b.life = 0; break;
        }
      }
    }
    if (b.x < -60 || b.x > WORLD.w + 60 || b.y < -300 || b.y > WORLD.h + 240) b.life = 0;
  }
  bullets = bullets.filter(b => b.life > 0);
}

function updateGrenades(dt) {
  for (const g of grenades) {
    g.t -= dt; g.rot += dt*10;
    g.vy += GRAV()*0.85*dt;
    g.x += g.vx*dt; g.y += g.vy*dt;
    for (const pf of platforms) {
      if (g.x > pf.x - 5 && g.x < pf.x + pf.w + 5 && g.y > pf.y - 5 && g.y < pf.y + pf.h + 5) {
        const ox = g.vx > 0 ? pf.x - 5 - g.x : pf.x + pf.w + 5 - g.x;
        const oy = g.vy > 0 ? pf.y - 5 - g.y : pf.y + pf.h + 5 - g.y;
        if (Math.abs(ox) < Math.abs(oy)) { g.x += ox; g.vx *= -0.45; }
        else { g.y += oy; g.vy *= -0.42; g.vx *= 0.7; }
      }
    }
    if (g.t <= 0) explode(g.x, g.y, 165, 78, g.owner);
  }
  grenades = grenades.filter(g => g.t > 0);
}

function updateDrops(dt) {
  for (const d of drops) {
    d.t += dt;
    d.vy = Math.min(420, d.vy + GRAV()*0.35*dt);
    d.y += d.vy*dt;
    for (const pf of platforms) {
      if (d.x > pf.x - 18 && d.x < pf.x + pf.w + 18 && d.y + 14 > pf.y && d.y < pf.y + pf.h) {
        d.y = pf.y - 14; d.landed = true; break;
      }
    }
    if (d.landed) {
      pickups.push({ kind:'gun', x:d.x, y:d.y, t:0, ready:true, respawn:0, gun:d.gun, temp:true, tier:3 });
      spark(d.x, d.y, 14, '#ffd166', 260);
      d.done = true;
    }
    if (d.y > WORLD.h + 200) d.done = true;
  }
  drops = drops.filter(d => !d.done);
}

// Guests: predict our own player with the real physics, interpolate the rest,
// and push input up to the host.
function netGuestUpdate(dt) {
  const you = NET.hasSlot ? me() : null;                 // no slot yet = spectate
  if (you && !you.dead) {
    you.guard = 0; you.isRemote = false;
    humanControl(you, dt);
    you.vy += GRAV() * dt;
    if (you.onGround && Math.abs(you.vx) > 1) you.vx *= Math.pow(FRICTION, dt*60);
    you.vy = Math.min(MAX_FALL, you.vy);
    if (you.jetting && you.fuel > 0) you.fuel = Math.max(0, you.fuel - JET_DRAIN*dt);
    else you.fuel = Math.min(100, you.fuel + JET_REGEN*(you.onGround ? 1.6 : 1)*dt);
    movePlayer(you, dt);
    animate(you, dt);
  }
  for (const p of players) {
    if (p === you) continue;
    if (p.nx !== undefined) {                     // smooth toward the last snapshot
      p.x += (p.nx - p.x) * Math.min(1, dt*16);
      p.y += (p.ny - p.y) * Math.min(1, dt*16);
    }
    animate(p, dt);
  }
  for (const b of bullets) { b.x += b.vx*dt; b.y += b.vy*dt; }
  updateMovers(dt);
  for (const pk of pickups) pk.t += dt;

  NET.sendAcc += dt;
  if (NET.sendAcc >= NET.IN_HZ) {
    NET.sendAcc = 0;
    NET.send({ t:'in', d: readLocalInput() });
  }
}

function readLocalInput() {
  const you = me();
  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft)  mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (ui.stickL.active) { mx += ui.stickL.kx; my += ui.stickL.ky; }
  mx = Math.max(-1, Math.min(1, mx));
  const up = (keys.KeyW || keys.Space || keys.ArrowUp || (ui.stickL.active && my < -0.35)) ? 1 : 0;
  const stickFiring = ui.stickR.active && Math.hypot(ui.stickR.kx, ui.stickR.ky) > 0.55;
  const d = {
    mx, up, aim: +(you ? you.aim : 0).toFixed(2),
    fire: (ui.mouseFire || stickFiring || keys.KeyJ) ? 1 : 0,
    nade: netPulse.nade, rel: netPulse.rel, mel: netPulse.mel
  };
  netPulse.nade = netPulse.rel = netPulse.mel = 0;
  return d;
}
const netPulse = { nade:0, rel:0, mel:0 };

// [root MIDI note, bpm] per arena: A, D, E, C minor
const LEVEL_SONGS = [[57, 112], [50, 118], [52, 100], [48, 128]];

function update(dt) {
  tGlobal += dt;
  const sg = LEVEL_SONGS[(state === 'play' ? levelIndex : menuSel) % LEVEL_SONGS.length];
  SFX.setSong(sg[0], sg[1], state === 'play' && !paused ? 1 : 0);
  if (state === 'play' && paused) { SFX.jet(false, 0); return; }

  if (state === 'play' && NET.role === 'guest') { netGuestUpdate(dt); }
  else if (state === 'play') {
    if (mode === 'sv' && !pendingOver) updateSurvival(dt);
    updateMovers(dt);
    for (const pl of players) updatePlayer(pl, dt);
    updateBullets(dt);
    updateGrenades(dt);
    updateDrops(dt);
    for (const pk of pickups) {
      pk.t += dt;
      if (!pk.ready) {
        pk.respawn -= dt;
        if (pk.respawn <= 0) {
          pk.ready = true;
          spark(pk.x, pk.y, 14, pk.tier === 3 ? '#ffd166' : '#6ee7ff', 240);
          // the big ones are announced so everyone knows it's time to fight for them
          const big = (pk.kind === 'gun' && pk.tier === 3) ||
                      (pk.kind === 'power' && (pk.power === 'shield' || pk.power === 'damage'));
          if (big && !pk.temp) {
            const label = pk.kind === 'gun' ? WEAPONS[pk.gun].name : POWERS[pk.power].name;
            feed.unshift({ t:3.2, a:'', ac:'#888', b: label + ' is back', bc:'#ffd166' });
            SFX.ui();
          }
        }
      }
    }
    pickups = pickups.filter(pk => !(pk.temp && !pk.ready));

    if (pendingOver) {
      slowT -= dt / Math.max(0.05, timeScale);           // count in real seconds
      if (slowT <= 0) {
        state = 'over'; matchOver = pendingOver; timeScale = 1; cam.tzoom = 1;
        const you = me();
        if (you.kills > save.best) save.best = you.kills;
        if (mode === 'sv') {
          const bw = save.bestWave[levelIndex] || 0;
          if (sv.wave - 1 > bw) save.bestWave[levelIndex] = Math.max(0, sv.wave - 1);
          persist(); SFX.lose();
          return;
        }
        if (matchOver === you && levelIndex + 1 >= save.unlocked && levelIndex + 1 < LEVELS.length) {
          save.unlocked = levelIndex + 2;
          menuSel = levelIndex + 1;
        }
        persist();
        if (matchOver === you) SFX.win(); else SFX.lose();
      }
    }
  }

  // effects
  for (const q of parts) {
    if (q.chunk) q.rot += q.vr * dt;
    q.vy += (q.smoke ? -30 : 700) * dt;
    if (q.smoke) { q.vx *= 0.97; q.size += dt*14; }
    q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt;
  }
  parts = parts.filter(q => q.life > 0);
  const pcap = Q.level >= 2 ? 520 : Q.level === 1 ? 260 : 130;
  if (parts.length > pcap) parts.splice(0, parts.length - pcap);

  for (const c of casings) {
    c.vy += 1500*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt; c.life -= dt;
    for (const pf of platforms) {
      if (c.x > pf.x && c.x < pf.x + pf.w && c.y > pf.y && c.y < pf.y + pf.h) { c.y = pf.y; c.vy *= -0.3; c.vx *= 0.6; }
    }
  }
  casings = casings.filter(c => c.life > 0);

  for (const c of corpses) {
    c.vy += GRAV()*0.9*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt; c.life -= dt;
    for (const pf of platforms) {
      if (c.x > pf.x && c.x < pf.x + pf.w && c.y + 12 > pf.y && c.y < pf.y + pf.h && c.vy > 0) {
        c.y = pf.y - 12; c.vy *= -0.25; c.vx *= 0.7; c.vr *= 0.6;
      }
    }
  }
  corpses = corpses.filter(c => c.life > 0);

  for (const f of fireballs) f.t += dt;
  fireballs = fireballs.filter(f => f.t < f.life);
  for (const w of waves) { w.r += (w.max - w.r) * Math.min(1, dt*7); w.life -= dt*2.2; }
  waves = waves.filter(w => w.life > 0);
  for (const dc of decals) dc.life -= dt*0.05;
  decals = decals.filter(dc => dc.life > 0);
  for (const bm of beams) bm.life -= dt*3.2;
  beams = beams.filter(bm => bm.life > 0);

  for (const f of feed) f.t -= dt;
  feed = feed.filter(f => f.t > 0);
  for (const f of floaters) { f.y += f.vy*dt; f.vy += 40*dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);

  for (const a of dmgArrows) a.t -= dt;
  dmgArrows = dmgArrows.filter(a => a.t > 0);
  if (hintT > 0) { hintT -= dt; if (hintT <= 0 && !save.tutorialSeen) { save.tutorialSeen = true; persist(); } }
  hitMark = Math.max(0, hitMark - dt);
  hurtFlash = Math.max(0, hurtFlash - dt*1.6);
  flashWhite = Math.max(0, flashWhite - dt*2.2);
  streak.t = Math.max(0, streak.t - dt);

  // host shares the lobby roster while people are still in the menu
  if (NET.role === 'host' && state !== 'play') {
    NET.lobbyAcc += dt;
    if (NET.lobbyAcc > 2) { NET.lobbyAcc = 0; NET.sendLobby(); }    // slow refresh; events push instantly
  }

  // host broadcasts the world ~20x/sec
  if (NET.role === 'host' && NET.count > 1 && state === 'play') {
    NET.snapAcc += dt;
    if (NET.snapAcc >= NET.SNAP_HZ) {
      NET.snapAcc = 0;
      NET.send({ t:'sn', d: NET.snapshot() });
      NET.send({ t:'lvl', i: levelIndex, m: mode });
    }
  }

  const you = me();
  SFX.jet(state === 'play' && !you.dead && you.jetting && you.fuel > 0, 1);

  // camera
  // while you're down, the camera rides your killer; otherwise it follows you
  if (deathCam) {
    deathCam.t -= dt;
    if (deathCam.t <= 0 || !you.dead || deathCam.p.gone) deathCam = null;
  }
  const watching = (!pendingOver && you.dead && deathCam && !deathCam.p.gone) ? deathCam.p : null;
  const focus = pendingOver ? { x: you.x, y: you.y } : (watching || you);
  const lead = watching || you;                    // lead ahead of whoever we watch
  const tx = focus.x + Math.cos(lead.aim)*120 - W/2;
  const ty = focus.y + Math.sin(lead.aim)*60 - H/2;
  cam.x += (tx - cam.x) * Math.min(1, dt*6);
  cam.y += (ty - cam.y) * Math.min(1, dt*6);
  // the finishing kill holds a zoom; everything else springs back to 1
  if (pendingOver) cam.tzoom = 1.45;
  else cam.tzoom += (1 - cam.tzoom) * Math.min(1, dt*3);
  cam.zoom += (cam.tzoom - cam.zoom) * Math.min(1, dt*5);
  const vw = W / cam.zoom, vh = H / cam.zoom;
  cam.x = Math.max(-40 - (W - vw)/2, Math.min(WORLD.w - vw + 40 - (W - vw)/2, cam.x));
  // on touch screens the sticks cover the bottom of the view, so let the
  // camera scroll past the floor far enough that you stay above your thumbs
  const floorPad = IS_TOUCH ? Math.max(60, H - (ui.stickL.cy - ui.stickL.r) + 12) / cam.zoom : 60;
  cam.y = Math.max(-140 - (H - vh)/2, Math.min(WORLD.h - vh + floorPad - (H - vh)/2, cam.y));
  if (vw > WORLD.w) cam.x = (WORLD.w - W)/2;
  if (vh > WORLD.h) cam.y = (WORLD.h - H)/2;

  shake = Math.max(0, shake - dt*40);
}

// ==================================================================
// RENDER
// ==================================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ------------------------------------------------------------------
// RENDER CACHES + QUALITY
// Everything that doesn't change per-frame is pre-rendered once. Quality
// auto-drops if frames get expensive, so big screens and phones stay smooth.
// ------------------------------------------------------------------
const Q = { level: 2, auto: true, ms: 0, fps: 60, _acc: 0, _n: 0, _t: 0 };
const QNAMES = ['LOW', 'MEDIUM', 'HIGH'];
let vignetteGrad = null, grainPat = null, starCan = null;
let skyCans = null, skyForLevel = -1, skyForW = 0;
const platStrip = {};        // platform height -> pre-shaded vertical strip
const lightSprite = {};      // colour -> radial glow sprite

function offscreen(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  return c;
}

function getLightSprite(color) {
  if (lightSprite[color]) return lightSprite[color];
  const S = 128, c = offscreen(S, S), g = c.getContext('2d');
  const grd = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grd.addColorStop(0, color.replace('ALPHA', '1'));
  grd.addColorStop(0.45, color.replace('ALPHA', '0.35'));
  grd.addColorStop(1, color.replace('ALPHA', '0'));
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  lightSprite[color] = c;
  return c;
}

function getPlatStrip(h, plat, edge) {
  const key = h + '|' + plat + '|' + edge;
  if (platStrip[key]) return platStrip[key];
  const c = offscreen(8, h), g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, plat);
  grd.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = grd; g.fillRect(0, 0, 8, h);
  g.fillStyle = edge; g.fillRect(0, 0, 8, 3);
  g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(0, 3, 8, 1);
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, h - 2, 8, 2);
  platStrip[key] = c;
  return c;
}

// scorch marks left by impacts — they fade, so the arena tells the story of the fight
function decal(x, y, r) {
  if (Q.level < 1) return;
  decals.push({ x, y, r, life: 1 });
  if (decals.length > 70) decals.shift();
}
// queue a light for this frame's additive pass
function light(x, y, r, color, a) { if (Q.level >= 1) lights.push({ x, y, r, color, a }); }

// one-time noise tile for film grain
const grainTile = (() => {
  const c = offscreen(128, 128);
  const g = c.getContext('2d'), img = g.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 120 + Math.random() * 135;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 14;
  }
  g.putImageData(img, 0, 0);
  return c;
})();

// one drawImage per light instead of building a gradient every frame
function lightPass() {
  if (!lights.length || Q.level < 1) { lights.length = 0; return; }
  ctx.globalCompositeOperation = 'lighter';
  for (const l of lights) {
    const sp = getLightSprite(l.color);
    ctx.globalAlpha = Math.max(0, Math.min(1, l.a));
    ctx.drawImage(sp, l.x - l.r, l.y - l.r, l.r*2, l.r*2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  lights.length = 0;
}

// ---- bloom ---------------------------------------------------------------
// Downscale the rendered world, square it so only bright pixels survive, then
// add it back blurred. Three draw calls, and it makes every emissive thing —
// flames, tracers, explosions, neon trim — actually spill light.
let bloomA = null, bloomB = null;
function bloomPass() {
  if (Q.level < 2) return;
  if (!cv.width || !cv.height) return;           // hidden/minimised window: nothing to copy
  const bw = Math.max(32, (W/4)|0), bh = Math.max(32, (H/4)|0);
  if (!bloomA || bloomA.width !== bw || bloomA.height !== bh) {
    bloomA = offscreen(bw, bh); bloomB = offscreen(bw, bh);
  }
  const a = bloomA.getContext('2d'), b = bloomB.getContext('2d');

  a.globalCompositeOperation = 'source-over';
  a.clearRect(0, 0, bw, bh);
  a.drawImage(cv, 0, 0, bw, bh);
  a.globalCompositeOperation = 'multiply';       // keep the brights, crush the mids
  a.drawImage(bloomA, 0, 0);
  a.drawImage(bloomA, 0, 0);
  a.drawImage(bloomA, 0, 0);                     // x^4: only genuinely hot pixels survive
  a.globalCompositeOperation = 'source-over';

  b.clearRect(0, 0, bw, bh);                     // cheap separable-ish blur
  b.globalAlpha = 0.5;
  b.drawImage(bloomA, -1, 0); b.drawImage(bloomA, 1, 0);
  b.drawImage(bloomA, 0, -1); b.drawImage(bloomA, 0, 1);
  b.globalAlpha = 1;

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.40;
  ctx.drawImage(bloomB, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function postFX() {
  if (!vignetteGrad) {
    vignetteGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.42, W/2, H/2, Math.max(W,H)*0.78);
    vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
  }
  ctx.fillStyle = vignetteGrad; ctx.fillRect(0, 0, W, H);

  if (Q.level < 2) return;                       // grain is the first thing to go
  if (!grainPat) grainPat = ctx.createPattern(grainTile, 'repeat');
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = grainPat;
  ctx.save();
  ctx.translate((tGlobal*37) % 128 - 128, (tGlobal*53) % 128 - 128);
  ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// watch real frame cost and step quality down (or back up) to hold 60fps
function tuneQuality(ms) {
  Q._acc += ms; Q._n++;
  if (Q._n < 45) return;
  Q.ms = Q._acc / Q._n; Q.fps = Math.round(1000 / Math.max(0.3, Q.ms));
  Q._acc = 0; Q._n = 0;
  if (!Q.auto) return;
  if (Q.ms > 13 && Q.level > 0) { Q.level--; vignetteGrad = null; grainPat = null; }
  else if (Q.ms < 6.5 && Q.level < 2) Q.level++;
}

// pre-render the parallax skyline / starfield once per level+size
function buildSky() {
  if (level.bg === 'city') {
    const specs = [
      { bw:160, hMax:260, tint:'rgba(120,160,230,0.035)', win:false },
      { bw:112, hMax:190, tint:'rgba(110,150,220,0.06)',  win:false },
      { bw:74,  hMax:130, tint:'rgba(90,120,190,0.10)',   win:true  }
    ];
    skyCans = specs.map((sp, layer) => {
      const N = 28, SH = 460, c = offscreen(sp.bw*N, SH), g = c.getContext('2d');
      for (let i = 0; i < N; i++) {
        const seed = i + layer*97;
        const rnd = Math.abs(Math.sin(seed*12.9898)*43758.5453) % 1;
        const h = 70 + rnd*sp.hMax, x = i*sp.bw, top = SH - 120 - h;
        g.fillStyle = sp.tint;
        g.fillRect(x, top, sp.bw - 8, h + 120);
        if (sp.win) {
          g.fillStyle = 'rgba(255,214,140,0.20)';
          for (let wy = top + 12; wy < top + h - 8; wy += 20)
            for (let wx = x + 8; wx < x + sp.bw - 20; wx += 18)
              if (Math.abs(Math.sin((wx*3.1 + wy*7.7 + seed)*0.7)) > 0.72) g.fillRect(wx, wy, 6, 8);
        }
      }
      return { can:c, w:sp.bw*N, h:SH, par:[0.10, 0.22, 0.40][layer] };
    });
    starCan = null;
  } else if (level.bg === 'space') {
    const c = offscreen(Math.max(320, W), Math.max(320, H)), g = c.getContext('2d');
    for (let i = 0; i < 190; i++) {
      const x = Math.random()*c.width, y = Math.random()*c.height;
      const sz = Math.random() < 0.15 ? 2.5 : 1.4;
      g.fillStyle = 'rgba(255,255,255,' + (0.18 + Math.random()*0.42) + ')';
      g.fillRect(x, y, sz, sz);
    }
    starCan = c; skyCans = null;
  } else {
    skyCans = null; starCan = null;
  }
  skyForLevel = levelIndex; skyForW = W;
}

function background() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, level.pal.sky1); g.addColorStop(0.7, level.pal.sky2); g.addColorStop(1, '#05070e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (skyForLevel !== levelIndex || skyForW !== W) buildSky();

  if (level.bg === 'city') {
    const baseY = (WORLD.h - cam.y - H/2)*cam.zoom + H/2;
    if (skyCans) {
      for (const sk of skyCans) {
        const off = -((cam.x*sk.par) % sk.w);
        const top = baseY - sk.h + 120;
        for (let x = off - sk.w; x < W + sk.w; x += sk.w) ctx.drawImage(sk.can, x, top);
      }
    }
    if (Q.level >= 1) {
      ctx.fillStyle = 'rgba(110,231,255,0.03)';
      for (let i = 0; i < 4; i++) {
        const hx = ((i*430 - cam.x*0.06 + tGlobal*8) % (W + 500)) - 250;
        ctx.beginPath(); ctx.ellipse(hx, H*0.35 + i*40, 220, 46, 0, 0, Math.PI*2); ctx.fill();
      }
    }
  } else if (level.bg === 'space') {
    if (Q.level >= 1) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const nx = W*(0.2 + i*0.33) - cam.x*0.03, ny = H*(0.3 + (i%2)*0.3);
        const col = ['rgba(167,139,250,ALPHA)', 'rgba(110,231,255,ALPHA)', 'rgba(255,107,129,ALPHA)'][i];
        ctx.globalAlpha = 0.10;
        ctx.drawImage(getLightSprite(col), nx - 300, ny - 300, 600, 600);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    if (starCan) {
      for (let layer = 0; layer < 2; layer++) {
        const par = layer ? 0.14 : 0.06;
        const ox = -((cam.x*par) % starCan.width), oy = -((cam.y*par*0.5) % starCan.height);
        ctx.globalAlpha = layer ? 0.75 : 1;
